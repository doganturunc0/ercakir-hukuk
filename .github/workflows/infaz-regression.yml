name: İnfaz hesaplama regresyon testi
on:
  pull_request:
    paths:
      - 'infaz-hesaplama*'
      - '.github/infaz-tests/**'
      - '.github/workflows/infaz-regression.yml'
  push:
    branches: [main]
    paths:
      - 'infaz-hesaplama*'
      - '.github/infaz-tests/**'
      - '.github/workflows/infaz-regression.yml'
permissions:
  contents: read
jobs:
  infaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Serve site locally
        run: python3 -m http.server 8000 >/dev/null 2>&1 &
      - name: Run reference scenarios
        run: |
          sleep 2
          for f in genel gecis-2023-oncesi ictima cocuk; do
            echo "### $f"
            CI=1 BASE=http://127.0.0.1:8000/infaz-hesaplama.html REF=.github/infaz-tests/$f.json node .github/infaz-tests/run.js
          done
