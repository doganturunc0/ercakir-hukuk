name: Remove stale E-E-A-T checks
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove intentionally retired education markers from audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ten-stage-regression-audit.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'Dokuz Eylül Üniversitesi Hukuk Fakültesi',","")
          s=s.replace("'baro sicil numarası 2150',","")
          s=s.replace("'alumniOf',","")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ten-stage-regression-audit.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Align regression audit with approved professional entity data'
          git push origin main
