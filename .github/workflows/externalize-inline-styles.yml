name: Externalize remaining inline styles

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/externalize-inline-styles.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  externalize:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Move style blocks to CSS files
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              'anlasmali-bosanma-davasi.html',
              'articles.html',
              'infaz-hesaplama.html',
              'tutuklama-kararina-itiraz.html',
          ]

          for name in pages:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              blocks = re.findall(r'<style\b[^>]*>(.*?)</style>', s, flags=re.I|re.S)
              if not blocks:
                  continue
              css_name = p.stem + '.inline.css'
              Path(css_name).write_text('\n\n'.join(b.strip() for b in blocks) + '\n', encoding='utf-8')
              s = re.sub(r'<style\b[^>]*>.*?</style>', '', s, flags=re.I|re.S)
              link = f'<link rel="stylesheet" href="{css_name}?v=20260901-1">'
              if link not in s:
                  s = s.replace('</head>', link + '\n</head>', 1)
              if not re.search(r'\sstyle\s*=', s, re.I):
                  s = s.replace("style-src 'self' 'unsafe-inline'", "style-src 'self'")
              p.write_text(s, encoding='utf-8')

      - name: Verify style extraction
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          bad=[]
          for name in ['anlasmali-bosanma-davasi.html','articles.html','infaz-hesaplama.html','tutuklama-kararina-itiraz.html']:
              s=Path(name).read_text(encoding='utf-8')
              if re.search(r'<style\b', s, re.I): bad.append(name + ': style block remains')
              if not Path(Path(name).stem + '.inline.css').exists(): bad.append(name + ': css file missing')
              if not re.search(r'\sstyle\s*=', s, re.I) and "style-src 'self' 'unsafe-inline'" in s:
                  bad.append(name + ': removable style unsafe-inline remains')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('Inline style blocks externalized successfully.')

      - name: Commit extracted styles
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add anlasmali-bosanma-davasi.html articles.html infaz-hesaplama.html tutuklama-kararina-itiraz.html '*.inline.css'
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Externalize remaining inline page styles'; git push; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
