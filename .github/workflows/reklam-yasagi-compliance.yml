name: Reklam Yasağı Uyum Düzeltmesi

on:
  push:
    branches: [seo-content-overhaul]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply advertising compliance patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-content-overhaul
      - name: Apply compliance edits
        run: python tools/reklam_yasagi_patch.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No compliance changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html *.html compliance.css
          git commit -m "Apply advertising compliance patch"
          git push origin HEAD:seo-content-overhaul
