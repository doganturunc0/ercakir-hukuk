name: Local SEO and trust pass once

on:
  push:
    branches: [local-seo-trust-20260914]

permissions:
  contents: write

jobs:
  local-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: local-seo-trust-20260914
          fetch-depth: 0
      - name: Strengthen local entity and trust signals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, sys

          TEL = '+90 553 321 85 93'
          EMAIL = 'avbusraturunc45@gmail.com'
          STREET = 'Zafer Mahallesi, Belediye Caddesi, Zaroğlu İş Merkezi No: 71/1, Kat: 3, No: 316'
          MAP = 'https://www.google.com/maps/search/?api=1&query=Er%C3%A7ak%C4%B1r+Hukuk+B%C3%BCrosu+Salihli+Manisa'
          SAMEAS = ['https://www.instagram.com/ercakirhukuk/','https://avukatbilgisi.com/manisa-barosu-avukatlari/301601-busra-turunc']
          OFFICE_ID='https://avbusraturunc.com/#office'
          PERSON_ID='https://avbusraturunc.com/#busra'

          def address_obj():
              return {'@type':'PostalAddress','streetAddress':STREET,'addressLocality':'Salihli','addressRegion':'Manisa','addressCountry':'TR'}

          def office_obj():
              return {
                  '@type':['Organization','LegalService','LocalBusiness'], '@id':OFFICE_ID,
                  'name':'Erçakır Hukuk Bürosu','url':'https://avbusraturunc.com/',
                  'telephone':TEL,'email':EMAIL,
                  'logo':'https://avbusraturunc.com/favicon.svg','image':'https://avbusraturunc.com/assets/hero-main.webp',
                  'areaServed':[{'@type':'City','name':'Salihli'},{'@type':'AdministrativeArea','name':'Manisa'}],
                  'address':address_obj(),'hasMap':MAP,'sameAs':SAMEAS,
                  'contactPoint':{'@type':'ContactPoint','telephone':TEL,'contactType':'office','availableLanguage':'tr'},
                  'employee':{'@id':PERSON_ID}
              }

          def person_obj():
              return {'@type':'Person','@id':PERSON_ID,'name':'Büşra Turunç','honorificPrefix':'Av.','jobTitle':'Avukat','url':'https://avbusraturunc.com/','worksFor':{'@id':OFFICE_ID}}

          def replace_jsonld(path, transform):
              p=Path(path); s=p.read_text(encoding='utf-8')
              m=re.search(r'<script\s+type=["\']application/ld\+json["\']>(.*?)</script>',s,re.I|re.S)
              if not m: raise SystemExit(f'JSON-LD not found: {path}')
              obj=json.loads(m.group(1))
              new_obj=transform(obj)
              block='<script type="application/ld+json">'+json.dumps(new_obj,ensure_ascii=False,separators=(',',':'))+'</script>'
              s2=s[:m.start()]+block+s[m.end():]
              p.write_text(s2,encoding='utf-8')

          def transform_home(obj):
              graph=obj.get('@graph',[])
              found=False
              for i,item in enumerate(graph):
                  if item.get('@id')==OFFICE_ID:
                      fresh=office_obj()
                      # Preserve any extra valid fields already present.
                      fresh.update({k:v for k,v in item.items() if k not in fresh})
                      graph[i]=fresh; found=True
              if not found: graph.insert(0,office_obj())
              obj['@graph']=graph
              return obj

          replace_jsonld('index.html', transform_home)

          contact_graph={
              '@context':'https://schema.org',
              '@graph':[
                  office_obj(), person_obj(),
                  {'@type':'ContactPage','@id':'https://avbusraturunc.com/iletisim.html#webpage','url':'https://avbusraturunc.com/iletisim.html','name':'İletişim | Erçakır Hukuk Bürosu | Salihli, Manisa','about':[{'@id':OFFICE_ID},{'@id':PERSON_ID}],'inLanguage':'tr-TR'},
                  {'@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'Ana Sayfa','item':'https://avbusraturunc.com/'},{'@type':'ListItem','position':2,'name':'İletişim','item':'https://avbusraturunc.com/iletisim.html'}]}
              ]
          }
          replace_jsonld('iletisim.html', lambda _: contact_graph)
          p=Path('iletisim.html'); s=p.read_text(encoding='utf-8')
          old='Konum ve diğer iletişim kanalları için ana sayfadaki <a href="index.html#iletisim">iletişim bölümünü</a> kullanabilirsiniz.'
          new=f'Büro konumunu <a href="{MAP}" target="_blank" rel="noopener noreferrer">Google Maps üzerinden görüntüleyebilirsiniz</a>. Büro hakkında kurumsal bilgi için <a href="hakkimizda.html">Hakkımızda</a> sayfasını inceleyebilirsiniz.'
          if old in s: s=s.replace(old,new,1)
          s=s.replace('© 2026 Erçakır Hukuk Bürosu · Av. Büşra Turunç · <a href="kvkk-aydinlatma-metni.html">KVKK</a>', '© 2026 Erçakır Hukuk Bürosu · Av. Büşra Turunç · <a href="hakkimizda.html">Hakkımızda</a> · <a href="kvkk-aydinlatma-metni.html">KVKK</a>',1)
          p.write_text(s,encoding='utf-8')

          def transform_about(obj):
              graph=obj.get('@graph',[])
              out=[]; have_office=False; have_person=False
              for item in graph:
                  if item.get('@id')==OFFICE_ID:
                      fresh=office_obj(); fresh.update({k:v for k,v in item.items() if k not in fresh}); out.append(fresh); have_office=True
                  elif item.get('@id')==PERSON_ID:
                      fresh=person_obj(); fresh.update({k:v for k,v in item.items() if k not in fresh}); out.append(fresh); have_person=True
                  else: out.append(item)
              if not have_office: out.insert(0,office_obj())
              if not have_person: out.insert(1,person_obj())
              obj['@graph']=out
              return obj

          replace_jsonld('hakkimizda.html', transform_about)
          p=Path('hakkimizda.html'); s=p.read_text(encoding='utf-8')
          marker='<h2>Çalışma yaklaşımı</h2>'
          insert=f'<h2>Büro ve iletişim bilgileri</h2><p><strong>Erçakır Hukuk Bürosu</strong><br>{STREET} · Salihli / Manisa<br><strong>Telefon:</strong> <a href="tel:+905533218593">{TEL}</a><br><strong>E-posta:</strong> <a href="mailto:{EMAIL}">{EMAIL}</a><br><a href="{MAP}" target="_blank" rel="noopener noreferrer">Google Maps konumu</a></p>'
          if insert not in s:
              if marker not in s: raise SystemExit('About insertion marker missing')
              s=s.replace(marker,insert+marker,1)
          p.write_text(s,encoding='utf-8')

          errors=[]
          for name in ('index.html','iletisim.html','hakkimizda.html'):
              text=Path(name).read_text(encoding='utf-8')
              m=re.search(r'<script\s+type=["\']application/ld\+json["\']>(.*?)</script>',text,re.I|re.S)
              if not m: errors.append(f'{name}: JSON-LD missing'); continue
              try: data=json.loads(m.group(1))
              except Exception as e: errors.append(f'{name}: invalid JSON-LD: {e}'); continue
              raw=json.dumps(data,ensure_ascii=False)
              for needle,label in [(TEL,'telephone'),(EMAIL,'email'),(STREET,'streetAddress'),('Salihli','Salihli'),('Manisa','Manisa')]:
                  if needle not in raw: errors.append(f'{name}: structured data missing {label}')
          for name in ('iletisim.html','hakkimizda.html'):
              text=Path(name).read_text(encoding='utf-8')
              if STREET not in text: errors.append(f'{name}: visible NAP address missing')
              if 'Google Maps' not in text: errors.append(f'{name}: visible map link missing')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('Local SEO/trust validation passed for homepage, contact and about pages.')
          PY

          git rm .github/workflows/local-seo-trust-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html iletisim.html hakkimizda.html
          git commit -m 'seo: strengthen local entity and trust signals'
          git push origin HEAD:local-seo-trust-20260914
