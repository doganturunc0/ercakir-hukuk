name: Hesaplama araçları regresyon testi
on:
  pull_request:
    paths:
      - 'sure-hesaplama.js'
      - 'hesaplama-araclari.js'
      - 'miras-payi.js'
      - 'kira-artis.js'
      - 'issizlik-maasi.js'
      - 'maas-haczi.js'
      - 'nafaka-artis.js'
      - 'tutar-bicim.js'
      - 'script.js'
      - 'index.html'
      - '*-hesaplama.html'
      - '.github/calc-tests/**'
      - '.github/workflows/calc-regression.yml'
  push:
    branches: [main]
    paths:
      - 'sure-hesaplama.js'
      - 'hesaplama-araclari.js'
      - 'miras-payi.js'
      - 'kira-artis.js'
      - 'issizlik-maasi.js'
      - 'maas-haczi.js'
      - 'nafaka-artis.js'
      - 'tutar-bicim.js'
      - 'script.js'
      - 'index.html'
      - '*-hesaplama.html'
      - '.github/calc-tests/**'
      - '.github/workflows/calc-regression.yml'
permissions:
  contents: read
jobs:
  calc:
    runs-on: ubuntu-24.04  # Playwright, ubuntu-latest (26.04) üzerinde tarayıcı bağımlılıklarını kuramıyor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Serve site locally
        run: python3 -m http.server 8000 >/dev/null 2>&1 &
      - name: Run calculator scenarios
        run: |
          sleep 2
          BASE=http://127.0.0.1:8000/ node .github/calc-tests/run.js
      - name: Random input comparison against independent reference
        run: BASE=http://127.0.0.1:8000/ N=200 node .github/calc-tests/fuzz.js
      - name: Inheritance share scenarios (TMK 495-506)
        run: BASE=http://127.0.0.1:8000/ node .github/calc-tests/miras.js
      - name: Legal deadline scenarios (HMK, CMK, İYUK, İİK)
        run: BASE=http://127.0.0.1:8000/ node .github/calc-tests/sure.js
      - name: Amount fields thousands separator (typing, paste, delete)
        run: BASE=http://127.0.0.1:8000/ node .github/calc-tests/bicim.js
