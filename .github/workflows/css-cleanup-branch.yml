name: Safe CSS cleanup

on:
  push:
    branches: [css-cleanup-20260913]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: css-cleanup-20260913
          fetch-depth: 0
      - name: Audit and clean CSS safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          css_files = sorted(p for p in root.glob('*.css') if p.is_file())
          scan_exts = {'.html','.htm','.js','.css','.xml','.txt','.md'}
          scan_files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in scan_exts and '.git' not in p.parts]

          refs = {}
          for css in css_files:
              name = css.name
              users = []
              for p in scan_files:
                  if p == css:
                      continue
                  try:
                      text = p.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  if name in text:
                      users.append(str(p))
              refs[name] = users

          print('\nCSS reference map:')
          for name, users in refs.items():
              print(f'- {name}: {len(users)} reference(s)')
              for u in users:
                  print(f'    {u}')

          protected = {
              'site.css','styles.css','home-polish.css','mobile-fix.css','content.css',
              'content-pages.css','analytics-consent.css','articles.inline.css',
              'infaz-hesaplama.inline.css','tutuklama-kararina-itiraz.inline.css'
          }

          removed = []
          for css in css_files:
              if css.name not in protected and not refs.get(css.name):
                  css.unlink()
                  removed.append(css.name)

          def normalized_css(text: str) -> str:
              text = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              return re.sub(r'\s+', '', text)

          styles = Path('styles.css')
          site = Path('site.css')
          migrated = False
          relation = 'missing'
          if styles.exists() and site.exists():
              old = styles.read_text(encoding='utf-8')
              new = site.read_text(encoding='utf-8')
              n_old = normalized_css(old)
              n_new = normalized_css(new)
              if n_old == n_new:
                  relation = 'equivalent'
              elif n_new.startswith(n_old):
                  relation = 'site.css is an exact normalized superset (old stylesheet + appended rules)'
              else:
                  relation = 'different'

              print(f'\nstyles.css bytes: {len(old.encode("utf-8"))}')
              print(f'site.css bytes: {len(new.encode("utf-8"))}')
              print(f'Base stylesheet relation: {relation}')

              if relation in {'equivalent', 'site.css is an exact normalized superset (old stylesheet + appended rules)'}:
                  for p in root.glob('*.html'):
                      text = p.read_text(encoding='utf-8')
                      updated = re.sub(
                          r'href=["\']styles\.css(?:\?[^"\']*)?["\']',
                          'href="site.css?v=20260913-2"',
                          text
                      )
                      if updated != text:
                          p.write_text(updated, encoding='utf-8')
                  styles.unlink()
                  migrated = True

          print(f'\nRemoved orphan CSS: {removed or "none"}')
          print(f'Collapsed styles.css -> site.css: {migrated}')
          PY

          if git diff --quiet; then
            echo 'No safe CSS changes were needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: consolidate verified duplicate CSS'
          git push origin HEAD:css-cleanup-20260913
