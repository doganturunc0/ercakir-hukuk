name: Self-host hero and consolidate assets

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for concurrent deploy source updates
        run: |
          sleep 20
          git fetch origin main
          git reset --hard origin/main

      - name: Self-host hero and consolidate CSS
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ ! -s assets/hero-main.png ]; then
            curl -L --fail --retry 3 'https://static.wixstatic.com/media/8fe0de_53498bec1baa472f9e4d84b0cd99f3f0~mv2.png' -o assets/hero-main.png
          fi
          python - <<'PY'
          from pathlib import Path
          import re

          stamp='20260828-17'
          wix='https://static.wixstatic.com/media/8fe0de_53498bec1baa472f9e4d84b0cd99f3f0~mv2.png'
          local_abs='https://avbusraturunc.com/assets/hero-main.png'
          local_css='/assets/hero-main.png'

          # Tek CSS dosyası: mevcut görünümü değiştirmeden yükleme sayısını azalt.
          parts=[]
          for name in ['styles.css','design-refresh.css','layout-fix.css','home-polish.css']:
              p=Path(name)
              if p.exists():
                  text=p.read_text(encoding='utf-8').replace(wix,local_css)
                  parts.append(f'/* ===== {name} ===== */\n{text.strip()}\n')
          Path('site.css').write_text('\n'.join(parts),encoding='utf-8')

          # Ana sayfa yalnızca kendi domainindeki hero ve tek CSS dosyasını kullansın.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace(wix,local_abs)
          s=re.sub(r'<link rel="preconnect" href="https://static\.wixstatic\.com"[^>]*>\s*','',s)
          s=re.sub(r'<link rel="dns-prefetch" href="//static\.wixstatic\.com"[^>]*>\s*','',s)
          for css in ['styles.css','design-refresh.css','layout-fix.css','home-polish.css','site.css']:
              s=re.sub(rf'<link rel="stylesheet" href="{re.escape(css)}(?:\?v=[^"]+)?">\s*','',s)
          marker='</head>'
          s=s.replace(marker,f'<link rel="stylesheet" href="site.css?v={stamp}">\n{marker}',1)
          s=s.replace("img-src 'self' data: https:;","img-src 'self' data:;")
          p.write_text(s,encoding='utf-8')

          # script.js artık CSS dosyası üretmesin/yüklemesin.
          js=Path('script.js')
          if js.exists():
              t=js.read_text(encoding='utf-8')
              t=re.sub(r"\(\(\)=>\{const stamp='[^']+';const base=.*?\}\)\(\);\n?",'',t,count=1,flags=re.S)
              js.write_text(t,encoding='utf-8')
          PY

      - name: Commit permanent asset cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-main.png site.css index.html script.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wix bağımlılığını kaldır ve CSS dosyalarını birleştir [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
