name: One-time homepage semantic cleanup
on:
  push:
    paths:
      - '.github/workflows/semantic-cleanup-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrowly scoped semantic cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_header = ' aria-label="Erçakır Hukuk ana sayfa" title="ER ERÇAKIR HUKUK BÜROSU"'
          new_header = ' aria-label="Erçakır Hukuk ana sayfa"'
          old_brand = '<div class="cover-mark">ER</div><small>ERÇAKIR HUKUK BÜROSU</small>'
          new_brand = '<div class="cover-mark" aria-hidden="true"></div><small aria-hidden="true"></small>'
          header_count = s.count(old_header)
          brand_count = s.count(old_brand)
          if header_count != 1:
              raise SystemExit(f'Expected 1 header title pattern, found {header_count}')
          if brand_count < 1:
              raise SystemExit('No legal-content cover brand patterns found')
          s = s.replace(old_header, new_header).replace(old_brand, new_brand)
          p.write_text(s, encoding='utf-8')

          c = Path('home-polish.css')
          css = c.read_text(encoding='utf-8')
          marker = '/* Decorative legal-card brand text: visual only, excluded from document semantics. */'
          rule = '\n'+marker+'\n.cover-mark[aria-hidden="true"]::before{content:"ER"}.legal-content-cover small[aria-hidden="true"]::before{content:"ERÇAKIR HUKUK BÜROSU"}\n'
          if marker not in css:
              css += rule
          c.write_text(css, encoding='utf-8')
          print(f'Updated header patterns: {header_count}; cover brand patterns: {brand_count}')
          PY
      - name: Verify only intended semantics changed
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'title="ER ERÇAKIR HUKUK BÜROSU"' not in s
          assert '<div class="cover-mark">ER</div><small>ERÇAKIR HUKUK BÜROSU</small>' not in s
          assert s.count('class="legal-content-card"') >= 20
          assert 'WhatsApp Yazışmaları Mahkemede Delil Olur mu?' in s
          css=Path('home-polish.css').read_text(encoding='utf-8')
          assert '.cover-mark[aria-hidden="true"]::before{content:"ER"}' in css
          print('Verification passed')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html home-polish.css
          git diff --cached --check
          git commit -m 'fix: remove decorative brand text from homepage semantics'
          git push