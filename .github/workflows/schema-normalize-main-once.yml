name: Final live SEO verification once
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/schema-normalize-main-once.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Verify deployed schema and SEO files
        shell: python
        run: |
          from pathlib import Path
          import re, sys, time, urllib.request

          domain='https://avbusraturunc.com/'
          article_pages=[]
          for p in sorted(Path('.').glob('*.html')):
              t=p.read_text(encoding='utf-8')
              if re.search(r'<main\b[^>]*\bclass=["\'][^"\']*\barticle-page\b', t, re.I):
                  article_pages.append(p.name)

          def fetch(url, tries=8):
              last=None
              for i in range(tries):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 final SEO verification'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          body=r.read().decode('utf-8','replace')
                          if r.status == 200:
                              return r.status,r.geturl(),body
                  except Exception as e:
                      last=e
                  time.sleep(5)
              raise RuntimeError(f'{url}: {last}')

          errors=[]
          # Wait briefly for hosting/CDN deployment after the preceding main commit.
          time.sleep(15)

          live_articles={}
          for page in article_pages:
              status,final,body=fetch(domain+page)
              live_articles[page]=body
              if domain+'#busra' not in body: errors.append(page+': live canonical person @id missing')
              if domain+'#office' not in body: errors.append(page+': live canonical office @id missing')
              if domain+'#busraturunc' in body or domain+'#organization' in body: errors.append(page+': live legacy entity @id remains')

          _,_,sitemap=fetch(domain+'sitemap.xml')
          urls=re.findall(r'<loc>(.*?)</loc>',sitemap)
          if len(urls)!=27: errors.append(f'live sitemap URL count {len(urls)} != 27')
          if domain+'articles.html' in urls: errors.append('live sitemap still contains legacy articles.html')

          _,_,legacy=fetch(domain+'articles.html')
          low=legacy.lower()
          if 'noindex' not in low: errors.append('live articles.html noindex missing')
          if 'https://avbusraturunc.com/hukuki-icerikler.html' not in legacy: errors.append('live articles.html canonical hub missing')

          _,_,rss=fetch(domain+'rss.xml')
          if rss.count('<item>')!=10: errors.append(f'live RSS item count {rss.count("<item>")} != 10')
          if 'articles.html#' in rss: errors.append('live RSS contains legacy fragment items')

          for name in ('llms.txt','llms-full.txt'):
              _,_,body=fetch(domain+name)
              hits=sum(1 for p in article_pages if domain+p in body)
              if hits!=len(article_pages): errors.append(f'{name}: live article coverage {hits}/{len(article_pages)}')

          _,_,home=fetch(domain)
          if domain+'#office' not in home: errors.append('live homepage #office entity missing')
          if domain+'#busra' not in home: errors.append('live homepage #busra entity missing')

          print('LIVE_ARTICLES',len(article_pages))
          print('LIVE_SITEMAP_URLS',len(urls))
          print('LIVE_RSS_ITEMS',rss.count('<item>'))
          print('ERRORS',errors if errors else 'none')
          if errors: sys.exit(1)
