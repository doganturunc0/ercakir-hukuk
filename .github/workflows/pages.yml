name: Deploy Erçakır Hukuk site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build safe Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ --exclude '_site/' --exclude '.git/' --exclude '.github/' --exclude '.gitignore' --exclude '.env' --exclude '.env.*' --exclude '*.pem' --exclude '*.key' --exclude '*.p12' --exclude '*.pfx' --exclude '*.jks' --exclude '*.keystore' --exclude 'credentials.json' --exclude 'service-account*.json' --exclude 'secrets.json' --exclude '*.secret'
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("frame-src 'none'", "frame-src https://www.google.com https://maps.google.com")
          if 'map-compact.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="map-compact.css?v=20260927-6">\n</head>')
          else:
              s = re.sub(r'map-compact\.css\?v=[^\"\']+', 'map-compact.css?v=20260927-6', s)
          if 'floating-contact.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="floating-contact.css?v=20260927-2">\n</head>')
          else:
              s = re.sub(r'floating-contact\.css\?v=[^\"\']+', 'floating-contact.css?v=20260927-2', s)
          s = re.sub(r'home-polish\.js\?v=[^\"\']+', 'home-polish.js?v=20260927-8', s)
          if 'contact-anchor-fix.js' not in s:
              s = s.replace('</body>', '<script src="contact-anchor-fix.js?v=20260927-1" defer></script>\n</body>')
          quick = '''<nav class="mobile-quick-contact" aria-label="Hızlı iletişim"><a class="quick-whatsapp" href="https://wa.me/905533218593" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp ile iletişime geç"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.5 4.1 1.6 5.9L.2 24l6.5-1.7a11.8 11.8 0 0 0 5.4 1.4h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.1-3.5-8.4Zm-8.3 18.2h-.1a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.8 1 1-3.7-.2-.4a9.8 9.8 0 1 1 8.5 4.7Zm5.4-7.3c-.3-.1-1.8-.9-2.1-1-.3-.1-.5-.1-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-1.7-.8-2.8-1.5-3.9-3.4-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9 0 1.7 1.2 3.3 1.4 3.5.1.2 2.4 3.7 5.9 5.2.8.4 1.5.6 2 .7.8.3 1.6.2 2.2.1.7-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.6-.3Z"/></svg></a><a class="quick-call" href="tel:+905533218593" aria-label="Erçakır Hukuk Bürosunu ara"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.7 3.6.7.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.7 3.6.1.4 0 .8-.2 1l-2.4 2.2Z"/></svg></a></nav>'''
          if 'mobile-quick-contact' not in s:
              s = s.replace('</body>', quick + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
          if find _site -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.jks' -o -name '*.keystore' -o -name 'credentials.json' -o -name 'service-account*.json' -o -name 'secrets.json' -o -name '*.secret' \) -print -quit | grep -q .; then
            echo 'Sensitive file detected in Pages artifact.' >&2
            exit 1
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: '_site'
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
