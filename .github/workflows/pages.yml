name: Deploy Erçakır Hukuk site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Homepage assets and content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          stamp = '20260828-13'
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('Ceza, aile, iş, icra ve diğer hukuk alanlarına ilişkin bilgilendirme.',
                        'Hukuki ihtiyaçların niteliğine göre ele alınan başlıca çalışma alanları.')

          s = re.sub(r'<link rel="stylesheet" href="design-refresh\.css\?v=[^"]+">>?', '', s)
          s = re.sub(r'<link rel="stylesheet" href="layout-fix\.css\?v=[^"]+">>?', '', s)
          s = re.sub(r'href="styles\.css(?:\?v=[^"]+)?"', f'href="styles.css?v={stamp}"', s)
          anchor = f'<link rel="stylesheet" href="styles.css?v={stamp}">'
          links = anchor + f'\n<link rel="stylesheet" href="design-refresh.css?v={stamp}">\n<link rel="stylesheet" href="layout-fix.css?v={stamp}">'
          s = s.replace(anchor, links)

          s = re.sub(r'src="script\.js(?:\?v=[^"]+)?"', f'src="script.js?v={stamp}"', s)

          s = re.sub(
              r'<div class="hero-meta">.*?</div>',
              '<div class="hero-meta"><a class="hero-infaz-btn" href="infaz-hesaplama.html" aria-label="İnfaz hesaplama aracını aç"><span><small>HESAPLAMA ARACI</small>İnfaz Hesaplama</span><b>Aracı Aç <span aria-hidden="true">→</span></b></a></div>',
              s,
              count=1,
              flags=re.S,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Persist homepage source
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Ana sayfa yerleşim düzeltmelerini sabitle [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
