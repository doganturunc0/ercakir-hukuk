name: Deploy Erçakır Hukuk site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Build safe Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.pem' \
            --exclude '*.key' \
            --exclude '*.p12' \
            --exclude '*.pfx' \
            --exclude '*.jks' \
            --exclude '*.keystore' \
            --exclude 'credentials.json' \
            --exclude 'service-account*.json' \
            --exclude 'secrets.json' \
            --exclude '*.secret'

          if find _site -type f \( \
              -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o \
              -name '*.p12' -o -name '*.pfx' -o -name '*.jks' -o -name '*.keystore' -o \
              -name 'credentials.json' -o -name 'service-account*.json' -o \
              -name 'secrets.json' -o -name '*.secret' \
            \) -print -quit | grep -q .; then
            echo 'Sensitive file detected in Pages artifact.' >&2
            exit 1
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: '_site'
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
