name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Scan tracked files for secrets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          excluded = {
              '.github/workflows/secret-scan.yml',
          }

          sensitive_names = [
              re.compile(r'(^|/)\.env($|\.)', re.I),
              re.compile(r'\.(pem|key|p12|pfx|jks|keystore)$', re.I),
              re.compile(r'(^|/)(credentials|secrets)\.json$', re.I),
              re.compile(r'(^|/)service-account.*\.json$', re.I),
          ]

          content_patterns = [
              ('AWS access key', re.compile(r'\bAKIA[0-9A-Z]{16}\b')),
              ('GitHub token', re.compile(r'\bgh[pousr]_[A-Za-z0-9_]{20,}\b')),
              ('Private key block', re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
              ('Google API key', re.compile(r'\bAIza[0-9A-Za-z\-_]{35}\b')),
              ('Generic secret assignment', re.compile(
                  r'(?i)\b(?:api[_-]?key|secret|token|password|passwd|client[_-]?secret)\b'
                  r'\s*[:=]\s*["\'][^"\'\n]{16,}["\']'
              )),
          ]

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          problems = []

          for raw in tracked:
              if not raw:
                  continue
              path = raw.decode('utf-8', 'surrogateescape')
              if path in excluded:
                  continue

              if any(p.search(path) for p in sensitive_names):
                  problems.append(f'{path}: sensitive filename must not be tracked')
                  continue

              p = Path(path)
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              if b'\x00' in data or len(data) > 2_000_000:
                  continue
              text = data.decode('utf-8', 'ignore')

              for label, pattern in content_patterns:
                  if pattern.search(text):
                      problems.append(f'{path}: possible {label}')

          if problems:
              print('Potential secret exposure detected:')
              for item in sorted(set(problems)):
                  print(' -', item)
              sys.exit(1)

          print('Secret scan passed: no tracked sensitive files or obvious credentials found.')
          PY
