name: One-time infaz verification date updater
on:
  push:
    paths:
      - '.github/workflows/one-time-infaz-control-date.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified control date
        shell: python
        run: |
          from pathlib import Path
          p=Path('infaz-hesaplama.html')
          s=p.read_text(encoding='utf-8')
          needle='<div class="warning"><b>Önemli:</b> Bu araç yalnızca genel ön hesaplama yapar.'
          replacement='<p class="calc-control-date"><strong>Mevzuat ve hesaplama parametreleri son kontrol:</strong> 29.09.2026</p><div class="warning"><b>Önemli:</b> Bu araç yalnızca genel ön hesaplama yapar.'
          if 'Mevzuat ve hesaplama parametreleri son kontrol:' in s:
              raise SystemExit('Control date already exists')
          if needle not in s:
              raise SystemExit('Expected warning block not found')
          s=s.replace(needle,replacement,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infaz-hesaplama.html
          git commit -m "Infaz: show verified legislation control date"
          git push