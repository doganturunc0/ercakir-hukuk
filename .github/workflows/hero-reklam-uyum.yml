name: Hero ve Reklam Yasağı Uyum

on:
  push:
    branches: [reklam-yasagi-uyum-2026-08-31]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reklam-yasagi-uyum-2026-08-31
          fetch-depth: 0

      - name: Build approved hero image
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/hero-chunks/*.txt | base64 --decode > assets/hero-main.webp
          test -s assets/hero-main.webp
          file assets/hero-main.webp

      - name: Update image references and apply conservative advertising-compliance cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          text_ext = {'.html', '.css', '.js', '.xml', '.txt', '.md', '.json', '.yml', '.yaml'}
          skip_roots = {'.git', '.tmp'}

          replacements = {
              'assets/hero-main.png': 'assets/hero-main.webp',
              '/assets/hero-main.png': '/assets/hero-main.webp',
              'Salihli Ceza Avukatı': 'Salihli Ceza Hukuku',
              'Salihli ceza avukatı': 'Salihli ceza hukuku',
              'Salihli Boşanma Avukatı': 'Salihli Aile ve Boşanma Hukuku',
              'Salihli boşanma avukatı': 'Salihli aile ve boşanma hukuku',
              'Salihli İş Hukuku Avukatı': 'Salihli İş Hukuku',
              'Salihli iş hukuku avukatı': 'Salihli iş hukuku',
              'Salihli İcra Avukatı': 'Salihli İcra ve İflas Hukuku',
              'Salihli icra avukatı': 'Salihli icra ve iflas hukuku',
              'Salihli Gayrimenkul Avukatı': 'Salihli Gayrimenkul Hukuku',
              'Salihli gayrimenkul avukatı': 'Salihli gayrimenkul hukuku',
              'Salihli Miras Avukatı': 'Salihli Miras Hukuku',
              'Salihli miras avukatı': 'Salihli miras hukuku',
              'Salihli Ticaret Avukatı': 'Salihli Ticaret Hukuku',
              'Salihli ticaret avukatı': 'Salihli ticaret hukuku',
              'Salihli İdare Avukatı': 'Salihli İdare Hukuku',
              'Salihli idare avukatı': 'Salihli idare hukuku',
              'Salihli Kira Avukatı': 'Salihli Kira Hukuku',
              'Salihli kira avukatı': 'Salihli kira hukuku',
              'Salihli Sigorta Avukatı': 'Salihli Sigorta Hukuku',
              'Salihli sigorta avukatı': 'Salihli sigorta hukuku',
          }

          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              if any(part in skip_roots for part in p.parts):
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              # Remove a standalone homepage/search-keyword style phrase only when used as an SEO label/title.
              text = re.sub(r'(?i)\bSalihli Avukat\b(?=\s*[|·\-])', 'Erçakır Hukuk Bürosu · Salihli', text)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(str(p))

          print('Updated text files:', ', '.join(changed) if changed else 'none')

      - name: Compliance scan
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          patterns = {
              'local-practice-attorney keyword': re.compile(r'(?i)Salihli\s+(?:ceza|boşanma|aile|iş(?:\s+hukuku)?|icra|gayrimenkul|miras|ticaret|idare|kira|sigorta)\s+avukat(?:ı|i)?'),
              'superiority claim': re.compile(r'(?i)\b(?:en\s+iyi|en\s+başarılı|lider)\s+avukat'),
              'expertise promotional claim': re.compile(r'(?i)\buzman\s+avukat'),
              'experience promotional claim': re.compile(r'(?i)\bdeneyimli\s+avukat'),
              'outcome guarantee': re.compile(r'(?i)\b(?:sonuç|başarı)\s+garanti(?:si|li)?'),
              'removed slogan': re.compile(r'(?is)güven.{0,30}deneyim.{0,30}çözüm'),
          }

          findings = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.css','.js','.xml','.txt','.md','.json'}:
                  continue
              if '.git' in p.parts or '.tmp' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              for label, rx in patterns.items():
                  for m in rx.finditer(text):
                      findings.append((str(p), label, m.group(0)[:100]))

          if findings:
              print('Potential advertising-compliance findings:')
              for item in findings:
                  print(' | '.join(item))
              sys.exit(1)
          print('Compliance scan passed: no targeted promotional/ranking phrases found.')

      - name: Remove staging files and old hero asset
        shell: bash
        run: |
          rm -f assets/hero-main.png
          rm -rf .tmp/hero-chunks
          rm -f .github/workflows/hero-reklam-uyum.yml

      - name: Commit completed update
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace hero image and tighten advertising compliance"
          git push origin HEAD:reklam-yasagi-uyum-2026-08-31
