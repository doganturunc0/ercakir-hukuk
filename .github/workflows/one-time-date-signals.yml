name: One-time verified article date signals
on:
  push:
    paths:
      - '.github/workflows/one-time-date-signals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source dates and expose consistent date signals
        shell: python
        run: |
          import re, pathlib, email.utils, datetime
          root=pathlib.Path('.')
          hub=(root/'hukuki-icerikler.html').read_text(encoding='utf-8')
          arts=re.findall(r'"url":"https://avbusraturunc.com/([^"/]+\.html)"', hub)
          arts=list(dict.fromkeys(arts))
          if len(arts)!=26:
              raise SystemExit(f'Expected 26 editorial articles, got {len(arts)}')
          rss=(root/'rss.xml').read_text(encoding='utf-8')
          rss_dates={}
          for item in re.findall(r'<item>(.*?)</item>', rss, re.S):
              lm=re.search(r'<link>https://avbusraturunc.com/([^<]+)</link>', item)
              pm=re.search(r'<pubDate>([^<]+)</pubDate>', item)
              if lm and pm:
                  dt=email.utils.parsedate_to_datetime(pm.group(1)).date().isoformat()
                  rss_dates[lm.group(1)]=dt
          changed=[]
          for fn in arts:
              p=root/fn
              s=p.read_text(encoding='utf-8')
              pubm=re.search(r'"datePublished"\s*:\s*"(\d{4}-\d{2}-\d{2})"',s)
              modm=re.search(r'"dateModified"\s*:\s*"(\d{4}-\d{2}-\d{2})"',s)
              if not pubm or not modm:
                  raise SystemExit(f'{fn}: missing datePublished/dateModified')
              pub,mod=pubm.group(1),modm.group(1)
              if pub>mod:
                  raise SystemExit(f'{fn}: datePublished later than dateModified')
              if fn not in rss_dates:
                  raise SystemExit(f'{fn}: missing RSS publication date')
              if rss_dates[fn] != pub:
                  raise SystemExit(f'{fn}: RSS {rss_dates[fn]} != JSON-LD {pub}')
              pub_tr=datetime.date.fromisoformat(pub).strftime('%d.%m.%Y')
              mod_tr=datetime.date.fromisoformat(mod).strftime('%d.%m.%Y')
              # Add standard article head signals only from already-verified source dates.
              if 'property="article:published_time"' not in s:
                  canonical=re.search(r'(<link rel="canonical" href="[^"]+">)',s)
                  if not canonical:
                      raise SystemExit(f'{fn}: canonical not found')
                  insert=(canonical.group(1)+f'<meta property="article:published_time" content="{pub}"><meta property="article:modified_time" content="{mod}">')
                  s=s[:canonical.start()]+insert+s[canonical.end():]
              # Expose publication date next to the already-visible last update date.
              old=f'<small>Son güncelleme: {mod_tr}</small>'
              new=f'<small>Yayın tarihi: {pub_tr} · Son güncelleme: {mod_tr}</small>'
              if old in s:
                  s=s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit(f'{fn}: visible modified date does not match schema dateModified')
              p.write_text(s,encoding='utf-8')
              changed.append(fn)
          print('Verified and updated',len(changed),'articles')
      - name: Commit verified date signals
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "SEO: expose verified article publication and update dates"
          git push