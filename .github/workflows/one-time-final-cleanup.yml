name: One-time final homepage cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-final-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Apply final cleanup
        shell: python
        run: |
          from pathlib import Path
          import json, re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          js_path = Path('home-polish.js')
          js = js_path.read_text(encoding='utf-8')

          # 1) Make the six key content links part of the initial HTML response.
          if 'id="hukuki-icerikler-home"' not in html:
              m = re.search(r"section\.innerHTML='(.*?)';faqSection", js, re.S)
              if not m:
                  raise SystemExit('Could not extract legal-content showcase from home-polish.js')
              section = '<section id="hukuki-icerikler-home" class="legal-content-showcase">' + m.group(1) + '</section>\n'
              marker = '<section class="home-faq" id="sss">'
              if marker not in html:
                  raise SystemExit('FAQ insertion marker not found')
              html = html.replace(marker, section + marker, 1)

          old_nav = '<nav id="mainNav"><a href="#hakkimizda" title="Hakkımızda">Hakkımızda</a><a href="#alanlar" title="Faaliyet Alanları">Faaliyet Alanları</a><a href="#hesaplamalar" title="Hesaplamalar">Hesaplamalar</a><a href="#makaleler" title="Bilgilendirmeler">Bilgilendirmeler</a><a href="#iletisim" title="İletişim">İletişim</a></nav>'
          new_nav = '<nav id="mainNav"><a href="#hakkimizda" title="Hakkımızda">Hakkımızda</a><a href="#alanlar" title="Faaliyet Alanları">Faaliyet Alanları</a><a href="#hesaplamalar" title="Hesaplamalar">Hesaplamalar</a><a href="#makaleler" title="Bilgilendirmeler">Bilgilendirmeler</a><a href="#hukuki-icerikler-home" title="Hukuki İçerikler">Hukuki İçerikler</a><a href="#iletisim" title="İletişim">İletişim</a></nav>'
          html = html.replace(old_nav, new_nav, 1)

          # 2) Remove duplicate favicon declarations and use the existing binary icon as Apple fallback.
          html = html.replace('<link rel="icon" href="/favicon.ico" sizes="any">\n', '')
          html = html.replace('<link rel="shortcut icon" href="https://avbusraturunc.com/favicon.svg" type="image/svg+xml">\n', '')
          html = html.replace('<link rel="apple-touch-icon" href="https://avbusraturunc.com/favicon.svg">', '<link rel="apple-touch-icon" href="/favicon.ico">')

          # 3) Neutralize schema: persistent social identities only; remove commercial OfferCatalog semantics.
          sm = re.search(r'(<script type="application/ld\+json">)(.*?)(</script>)', html, re.S)
          if not sm:
              raise SystemExit('Homepage JSON-LD not found')
          data = json.loads(sm.group(2))
          for node in data.get('@graph', []):
              if node.get('@id') == 'https://avbusraturunc.com/#office':
                  node.pop('hasOfferCatalog', None)
                  if isinstance(node.get('sameAs'), list):
                      node['sameAs'] = [u for u in node['sameAs'] if 'facebook.com/share/' not in u]
          schema = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
          html = html[:sm.start()] + sm.group(1) + schema + sm.group(3) + html[sm.end():]

          # 4) Improve social sharing copy without keyword stuffing.
          html = html.replace('<meta name="twitter:description" content="Av. Büşra Turunç ve Erçakır Hukuk Bürosu">', '<meta name="twitter:description" content="Erçakır Hukuk Bürosu’nun çalışma alanları, genel hukuki bilgilendirmeleri, hesaplama araçları ve iletişim bilgileri.">')

          index.write_text(html, encoding='utf-8')

          # 5) Keep only the map enhancement in JS. The legal-content showcase is now static HTML,
          # and the stylesheet is already loaded in index.html, so no duplicate stylesheet injection remains.
          map_only = js.splitlines()[0].strip() + '\n'
          if not map_only.startswith('(()=>{const mapCard='):
              raise SystemExit('Unexpected home-polish.js structure')
          js_path.write_text(map_only, encoding='utf-8')

      - name: Verify cleanup
        shell: python
        run: |
          from pathlib import Path
          import json, re
          h = Path('index.html').read_text(encoding='utf-8')
          j = Path('home-polish.js').read_text(encoding='utf-8')
          assert h.count('id="hukuki-icerikler-home"') == 1
          for page in ('tutuklama-kararina-itiraz.html','anlasmali-bosanma-davasi.html','kidem-ihbar-tazminati.html','icra-takibine-itiraz.html','tahliye-davasi.html','tapu-iptal-tescil-davasi.html'):
              assert page in h
          assert 'hasOfferCatalog' not in h
          assert 'facebook.com/share/' not in h
          assert 'section.innerHTML' not in j
          assert 'data-home-polish-css' not in j
          scripts = re.findall(r'<script type="application/ld\+json">(.*?)</script>', h, re.S)
          for s in scripts: json.loads(s)
          print('Final homepage cleanup verification passed.')

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-polish.js
          git commit -m "Finalize homepage SEO and schema cleanup"
          git push
