name: Harden content page CSP

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/harden-content-csp.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PAGES: "aile-bosanma-hukuku.html anlasmali-bosanma-davasi.html articles.html ceza-hukuku.html gayrimenkul-hukuku.html hukuki-icerikler.html icra-iflas-hukuku.html idare-hukuku.html infaz-hesaplama.html is-hukuku.html kira-hukuku.html miras-hukuku.html sigorta-hukuku.html ticaret-hukuku.html tutuklama-kararina-itiraz.html"

jobs:
  harden-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Replace inline analytics and tighten CSP
        shell: python
        run: |
          import os, pathlib, re

          def has_runtime_inline_script(html):
              for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>', html, re.I | re.S):
                  attrs = m.group(1)
                  if re.search(r'\bsrc\s*=', attrs, re.I):
                      continue
                  tm = re.search(r'\btype\s*=\s*(["\x27])([^"\x27]+)\1', attrs, re.I)
                  if tm and tm.group(2).lower().strip() == 'application/ld+json':
                      continue
                  body = m.group(2)
                  if 'dataLayer' in body and 'G-1E6W6P6281' in body and 'gtag' in body:
                      continue
                  return True
              return False

          def externalize_analytics(html):
              def repl(m):
                  attrs = m.group(1)
                  body = m.group(2)
                  if re.search(r'\bsrc\s*=', attrs, re.I):
                      return m.group(0)
                  if 'dataLayer' in body and 'G-1E6W6P6281' in body and 'gtag' in body:
                      return '<script src="analytics.js"></script>'
                  return m.group(0)
              return re.sub(r'<script\b([^>]*)>(.*?)</script>', repl, html, flags=re.I | re.S)

          for name in os.environ['PAGES'].split():
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = externalize_analytics(s)
              if not has_runtime_inline_script(s):
                  s = s.replace("script-src 'self' 'unsafe-inline' https://www.googletagmanager.com", "script-src 'self' https://www.googletagmanager.com")
              if '<style' not in s.lower() and ' style=' not in s.lower():
                  s = s.replace("style-src 'self' 'unsafe-inline'", "style-src 'self'")
              p.write_text(s, encoding='utf-8')

      - name: Verify hardened pages
        shell: python
        run: |
          import os, pathlib, re, sys

          def runtime_inline_scripts(html):
              found=[]
              for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>', html, re.I | re.S):
                  attrs=m.group(1)
                  if re.search(r'\bsrc\s*=', attrs, re.I):
                      continue
                  tm=re.search(r'\btype\s*=\s*(["\x27])([^"\x27]+)\1', attrs, re.I)
                  if tm and tm.group(2).lower().strip()=='application/ld+json':
                      continue
                  found.append(m.group(2))
              return found

          bad=[]
          for name in os.environ['PAGES'].split():
              p=pathlib.Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              for body in runtime_inline_scripts(s):
                  if 'dataLayer' in body or 'G-1E6W6P6281' in body:
                      bad.append(name + ': inline analytics remains')
              runtime=runtime_inline_scripts(s)
              if not runtime and "script-src 'self' 'unsafe-inline'" in s:
                  bad.append(name + ': removable script unsafe-inline remains')
              if 'http://avbusraturunc.com' in s or 'http://www.avbusraturunc.com' in s:
                  bad.append(name + ': insecure same-site URL')
              if 'name="referrer"' not in s:
                  bad.append(name + ': referrer policy missing')
              if 'http-equiv="Content-Security-Policy"' not in s:
                  bad.append(name + ': CSP missing')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('Content CSP audit passed.')

      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $PAGES
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Harden CSP across content pages'; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
