name: Cache bust homepage script

on:
  push:
    branches: ["main"]
    paths:
      - "home-polish.js"
      - ".github/workflows/cache-bust-home.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bump home-polish version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          version = os.environ['GITHUB_SHA'][:8]
          updated, count = re.subn(r'home-polish\.js\?v=[^"\']+', f'home-polish.js?v={version}', s, count=1)
          if count != 1:
              raise SystemExit('home-polish.js version reference not found exactly once')
          p.write_text(updated, encoding='utf-8')
          print(f'Homepage script version set to {version}')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Homepage script version already current."
            exit 0
          fi
          git commit -m "Bump homepage script version"
          git push
