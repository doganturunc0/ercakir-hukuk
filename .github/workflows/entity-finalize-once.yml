name: One-time entity normalization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/entity-finalize-once.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize entity graph and author signals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, xml.etree.ElementTree as ET

          PERSON='https://avbusraturunc.com/#busra-turunc'
          OFFICE='https://avbusraturunc.com/#ercakir-hukuk'
          root=Path('.')

          # Sitemap is the source of truth for indexable production HTML.
          tree=ET.parse('sitemap.xml')
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          targets=[]
          for loc in tree.findall('.//s:loc',ns):
              url=(loc.text or '').strip()
              path=url.replace('https://avbusraturunc.com/','')
              path='index.html' if path=='' else path
              if path.endswith('.html') and Path(path).exists(): targets.append(Path(path))
          targets=list(dict.fromkeys(targets))

          article_author_old='{"@type":"Person","name":"Av. Büşra Turunç","url":"https://avbusraturunc.com/hakkimizda.html"}'
          article_author_new='{"@type":"Person","@id":"%s","name":"Büşra Turunç","jobTitle":"Avukat","url":"https://avbusraturunc.com/hakkimizda.html","worksFor":{"@id":"%s"}}' % (PERSON,OFFICE)
          publisher_old='{"@type":"LegalService","name":"Erçakır Hukuk Bürosu","url":"https://avbusraturunc.com/"}'
          publisher_new='{"@type":["LegalService","Organization"],"@id":"%s","name":"Erçakır Hukuk Bürosu","url":"https://avbusraturunc.com/"}' % OFFICE

          changed=[]
          for p in targets:
              s=p.read_text(encoding='utf-8')
              old=s
              # Canonical IDs: one person and one office entity across the site.
              s=s.replace('https://avbusraturunc.com/#busra"', PERSON+'"')
              s=s.replace('https://avbusraturunc.com/#office"', OFFICE+'"')
              # Article author/publisher: person writes; organization publishes.
              s=s.replace(article_author_old,article_author_new)
              s=s.replace(publisher_old,publisher_new)
              # High-value semantic fields should spell out the profession.
              s=s.replace('<meta name="author" content="Av. Büşra Turunç">','<meta name="author" content="Avukat Büşra Turunç">')
              s=re.sub(r'(<title>[^<]*?)Av\. Büşra Turunç',r'\1Avukat Büşra Turunç',s)
              s=re.sub(r'(<meta property="og:title" content="[^"]*?)Av\. Büşra Turunç',r'\1Avukat Büşra Turunç',s)
              s=re.sub(r'(<meta name="twitter:title" content="[^"]*?)Av\. Büşra Turunç',r'\1Avukat Büşra Turunç',s)
              # Visible authorship: explicit profession, without injecting names into body paragraphs.
              s=s.replace('rel="author">Av. Büşra Turunç</a>','rel="author">Avukat Büşra Turunç</a>')
              # Canonical person page and homepage: make person-first hierarchy explicit in visible key copy.
              if p.name in ('index.html','hakkimizda.html'):
                  s=s.replace('<h1>Av. Büşra Turunç', '<h1>Avukat Büşra Turunç')
                  s=s.replace('<h2>Av. Büşra Turunç</h2>', '<h2>Avukat Büşra Turunç</h2>')
                  s=s.replace('Av. Büşra Turunç tarafından', 'Avukat Büşra Turunç tarafından')
                  s=s.replace('Av. Büşra Turunç, Dokuz Eylül', 'Avukat Büşra Turunç, Dokuz Eylül')
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))

          # Validate all sitemap HTML after mutation.
          titles={}; descs={}; errors=[]
          for p in targets:
              s=p.read_text(encoding='utf-8')
              if '<link rel="canonical"' not in s: errors.append(f'{p}: missing canonical')
              if 'noindex' in s.lower(): errors.append(f'{p}: unexpected noindex')
              mt=re.search(r'<title>(.*?)</title>',s,re.S)
              if not mt: errors.append(f'{p}: missing title')
              else: titles.setdefault(re.sub(r'\s+',' ',mt.group(1)).strip(),[]).append(str(p))
              md=re.search(r'<meta name="description" content="([^"]*)"',s,re.S)
              if not md: errors.append(f'{p}: missing description')
              else: descs.setdefault(md.group(1).strip(),[]).append(str(p))
              # Every JSON-LD block must parse.
              for i,b in enumerate(re.findall(r'<script[^>]+type="application/ld\+json"[^>]*>(.*?)</script>',s,re.S),1):
                  try: json.loads(b)
                  except Exception as e: errors.append(f'{p}: JSON-LD {i}: {e}')
              # Legacy IDs are not allowed after normalization.
              if 'https://avbusraturunc.com/#busra"' in s or 'https://avbusraturunc.com/#office"' in s:
                  errors.append(f'{p}: legacy entity id remains')
          dup_titles={k:v for k,v in titles.items() if len(v)>1}
          # descriptions can legitimately overlap on utility/legal pages; report only, don't fail.
          Path('entity-normalization-report.txt').write_text(
              'targets=%d\nchanged=%d\nchanged_files=%s\nduplicate_titles=%s\nerrors=%s\n' %
              (len(targets),len(changed),','.join(changed),repr(dup_titles),repr(errors)),encoding='utf-8')
          if errors or dup_titles:
              raise SystemExit('Validation failed: '+repr(errors)+' duplicate_titles='+repr(dup_titles))
          print(Path('entity-normalization-report.txt').read_text())
          PY
      - name: Commit normalized pages and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/entity-finalize-once.yml
          git add '*.html' entity-normalization-report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "seo: finalize Büşra Turunç entity hierarchy site-wide"
          git push origin main
