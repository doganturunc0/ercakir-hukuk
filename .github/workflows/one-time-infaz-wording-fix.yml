name: One-time infaz legal wording fix
on:
  push:
    paths:
      - '.github/workflows/one-time-infaz-wording-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct pre-6545 legal explanation
        shell: python
        run: |
          from pathlib import Path
          p=Path('infaz-hesaplama.runtime-1.js')
          s=p.read_text(encoding='utf-8')
          old='28.06.2014 öncesi suç için 5275 sayılı Kanunun geçici 6/4 hükmündeki 2/3 koşullu salıverilme oranı uygulandı.'
          new='28.06.2014 öncesi suç bakımından 6545 sayılı Kanunla getirilen özel 108/9 rejimi henüz yürürlükte olmadığından, o tarihte geçerli genel 2/3 koşullu salıverilme oranı esas alındı.'
          if old not in s:
              raise SystemExit('expected wording not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Syntax check
        run: node --check infaz-hesaplama.runtime-1.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infaz-hesaplama.runtime-1.js
          git commit -m "Correct pre-6545 infaz explanation"
          git push