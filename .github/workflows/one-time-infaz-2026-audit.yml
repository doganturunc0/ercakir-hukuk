name: One-time infaz 2026 validation
on:
  push:
    paths:
      - '.github/workflows/one-time-infaz-2026-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verified UI labels and control signal
        shell: python
        run: |
          from pathlib import Path
          p=Path('infaz-hesaplama.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Cinsel dokunulmazlığa karşı suçlar — temel grup','TCK 102 (2 hariç), 104 (2-3 hariç), 105 — yetişkin temel grup')
          s=s.replace('Cinsel dokunulmazlığa karşı suçlar — nitelikli grup','TCK 102/2, 103, 104/2-3 — yetişkin özel grup')
          old='<div class="warning"><b>Önemli:</b> Bu araç yalnızca genel ön hesaplama yapar. Kesin infaz hesabı; hükmün niteliği, suç tarihi, mahsup, tekerrür, iyi hâl ve güncel mevzuat birlikte incelenerek yapılmalıdır.</div>'
          new='<div class="warning"><b>Önemli:</b> Bu araç yalnızca genel ön hesaplama yapar. Kesin infaz hesabı; hükmün niteliği, suç tarihi, mahsup, tekerrür, iyi hâl ve geçiş hükümleri birlikte incelenerek yapılmalıdır.<br><small>Mevzuat ve hesaplama parametreleri son kontrol: 29.09.2026 · 5275 sayılı Kanun m.105/A, 107, 108 ve ilgili geçici hükümler.</small></div>'
          if old not in s: raise SystemExit('warning block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Static regression checks
        run: |
          node --check infaz-hesaplama.runtime-1.js
          node --check infaz-hesaplama-events.js
          grep -q "2025-06-04" infaz-hesaplama.runtime-1.js
          grep -q "2023-07-31" infaz-hesaplama.runtime-1.js
          grep -q "7593 sayılı Kanun" infaz-hesaplama.runtime-1.js
          grep -q "ikinci defa tekerrürde süreli hapis için 3/4" infaz-hesaplama.runtime-1.js
          grep -q "Mevzuat ve hesaplama parametreleri son kontrol: 29.09.2026" infaz-hesaplama.html
          ! grep -q "AÇIK KURUM EŞİĞİ" infaz-hesaplama.runtime-1.js
      - name: Commit UI verification changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infaz-hesaplama.html
          git commit -m "Update infaz calculator 2026 legal scope and control signal"
          git push