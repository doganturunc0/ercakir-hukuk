name: Redeploy Pages Once

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  actions: write

jobs:
  trigger-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
