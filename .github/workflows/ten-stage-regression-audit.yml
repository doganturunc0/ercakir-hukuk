name: Ten-stage SEO Regression Audit

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "sitemap.xml"
      - "scripts/ten_stage_regression.py"
      - ".github/workflows/ten-stage-regression-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Run ten-stage SEO regression audit
        run: python scripts/ten_stage_regression.py

# Runs the full ten-stage SEO/GEO regression audit against the checked-out main revision.
