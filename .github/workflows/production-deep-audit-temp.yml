name: Production deep audit temp
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit tooling
        run: |
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2 lighthouse@12.8.2
          npx playwright install --with-deps chromium
      - name: Production browser and accessibility audit
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const { AxeBuilder } = require('@axe-core/playwright');
          const fs = require('fs');
          const base='https://avbusraturunc.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const seed=await browser.newPage();
            const sm=await seed.request.get(base+'/sitemap.xml');
            if(!sm.ok()) throw new Error('sitemap HTTP '+sm.status());
            const xml=await sm.text();
            const urls=[...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m=>m[1].trim()).filter(u=>u.startsWith(base));
            if(!urls.length) throw new Error('No sitemap URLs');
            const results=[];
            for(const vp of [{device:'mobile',width:390,height:844},{device:'desktop',width:1440,height:900}]){
              for(const url of urls){
                const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
                const errs=[], warns=[], failed=[], bad=[];
                page.on('pageerror',e=>errs.push('pageerror: '+e.message));
                page.on('console',m=>{if(m.type()==='error') errs.push('console: '+m.text()); else if(m.type()==='warning') warns.push(m.text());});
                page.on('requestfailed',r=>failed.push(r.url()+' :: '+(r.failure()?.errorText||'')));
                page.on('response',r=>{if(r.status()>=400) bad.push(r.status()+' '+r.url())});
                let status=null, finalUrl=null, title='', h1=0, canonical='', overflow=false, axeCritical=0, axeSerious=0, axeTotal=0;
                try{
                  const res=await page.goto(url,{waitUntil:'networkidle',timeout:45000});
                  status=res?.status()||null; finalUrl=page.url(); title=await page.title(); h1=await page.locator('h1').count();
                  canonical=await page.locator('link[rel=canonical]').getAttribute('href').catch(()=>null)||'';
                  overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
                  const axe=await new AxeBuilder({page}).analyze();
                  axeTotal=axe.violations.length; axeCritical=axe.violations.filter(v=>v.impact==='critical').length; axeSerious=axe.violations.filter(v=>v.impact==='serious').length;
                  if(vp.device==='mobile' && url===base+'/'){
                    const toggle=page.locator('#navToggle,button[aria-controls="mainNav"]').first();
                    if(await toggle.count()){ await toggle.click(); await sleep(150); }
                  }
                }catch(e){errs.push('audit: '+e.message)}
                results.push({device:vp.device,url,status,finalUrl,title,h1,canonical,overflow,errors:errs,warnings:warns,failedRequests:failed,badResponses:bad,axe:{violations:axeTotal,critical:axeCritical,serious:axeSerious}});
                await page.close();
              }
            }
            // calculator interaction tests on production
            const calc=[];
            for(const vp of [{device:'mobile',width:390,height:844},{device:'desktop',width:1440,height:900}]){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}}); const errors=[];
              page.on('pageerror',e=>errors.push(e.message)); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              const r=await page.goto(base+'/infaz-hesaplama.html',{waitUntil:'networkidle',timeout:45000});
              const selectors={calculate:await page.locator('#calculateBtn').count(),reset:await page.locator('#resetBtn').count(),crime:await page.locator('#crimeType').count()};
              calc.push({device:vp.device,status:r?.status(),selectors,errors}); await page.close();
            }
            await browser.close();
            fs.writeFileSync('production-browser-audit.json',JSON.stringify({generatedAt:new Date().toISOString(),urlCount:urls.length,urls,results,calculator:calc},null,2));
            const summary={urlCount:urls.length,loads:results.length,httpNon200:results.filter(x=>x.status!==200).length,errorPages:results.filter(x=>x.errors.length).length,failedRequestPages:results.filter(x=>x.failedRequests.length).length,badResponsePages:results.filter(x=>x.badResponses.length).length,overflowPages:results.filter(x=>x.overflow).length,h1Problems:results.filter(x=>x.h1!==1).length,canonicalMissing:results.filter(x=>!x.canonical).length,axeCriticalPages:results.filter(x=>x.axe.critical).length,axeSeriousPages:results.filter(x=>x.axe.serious).length};
            console.log(JSON.stringify(summary,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Lighthouse production samples
        continue-on-error: true
        run: |
          mkdir -p lighthouse
          for u in / /ceza-hukuku.html /aile-bosanma-hukuku.html /is-hukuku.html /icra-iflas-hukuku.html /hukuki-icerikler.html /infaz-hesaplama.html; do
            n=$(echo "$u" | sed 's#^/$#home#; s#[/.]#-#g')
            npx lighthouse "https://avbusraturunc.com$u" --chrome-flags='--headless --no-sandbox' --only-categories=performance,accessibility,seo --output=json --output-path="lighthouse/${n}.json" --quiet || true
          done
          node <<'JS'
          const fs=require('fs'),path=require('path'); const out=[];
          for(const f of fs.readdirSync('lighthouse').filter(x=>x.endsWith('.json'))){const j=JSON.parse(fs.readFileSync(path.join('lighthouse',f)));out.push({file:f,url:j.finalUrl,categories:Object.fromEntries(Object.entries(j.categories).map(([k,v])=>[k,Math.round(v.score*100)])),metrics:{FCP:j.audits['first-contentful-paint']?.numericValue,LCP:j.audits['largest-contentful-paint']?.numericValue,CLS:j.audits['cumulative-layout-shift']?.numericValue,TBT:j.audits['total-blocking-time']?.numericValue,SI:j.audits['speed-index']?.numericValue}})}
          fs.writeFileSync('lighthouse-summary.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: production-deep-audit
          path: |
            production-browser-audit.json
            lighthouse-summary.json
            lighthouse/*.json
          retention-days: 3
