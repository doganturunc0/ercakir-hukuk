name: One-time infaz runtime check
on:
  push:
    paths:
      - '.github/workflows/one-time-infaz-runtime-check.yml'
      - 'infaz-hesaplama.runtime-1.js'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check infaz-hesaplama.runtime-1.js
      - name: Required legal guards
        run: |
          grep -q 'Geçici 6/4 çocuk hükümlü' infaz-hesaplama.runtime-1.js
          grep -q '7593 / cinsel suçta tam TCK maddesi gerekli' infaz-hesaplama.runtime-1.js
          grep -q '105/A %10 kurum süresi / mahsup ayrımı' infaz-hesaplama.runtime-1.js
          grep -q 'İlk tekerrür / 5275 m.108' infaz-hesaplama.runtime-1.js