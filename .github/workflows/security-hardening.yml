name: Site-wide security hardening

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "SECURITY.md"
      - "security.txt"
      - ".well-known/security.txt"
      - ".github/workflows/security-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Audit and harden HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Privacy-first CSP: no analytics, no third-party scripts, no iframes.
          csp = "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests\">"
          referrer = '<meta name="referrer" content="strict-origin-when-cross-origin">'

          changed = []
          audited = []

          for p in sorted(Path('.').glob('*.html')):
              text = p.read_text(encoding='utf-8')
              original = text
              audited.append(p.name)

              # Remove the legacy Google tag loader. Analytics is intentionally
              # disabled, so this third-party request is unnecessary.
              text = re.sub(r'\s*<!--\s*Google tag \(gtag\.js\)\s*-->\s*', '\n', text, flags=re.I)
              text = re.sub(
                  r'\s*<script\b[^>]*src=["\']https://www\.googletagmanager\.com/gtag/js\?id=G-1E6W6P6281["\'][^>]*>\s*</script>\s*',
                  '\n', text, flags=re.I
              )

              # Normalize every page to the current CSP.
              if re.search(r'<meta\b[^>]*http-equiv=["\']Content-Security-Policy["\'][^>]*>', text, re.I):
                  text = re.sub(
                      r'<meta\b[^>]*http-equiv=["\']Content-Security-Policy["\'][^>]*>',
                      csp, text, count=1, flags=re.I
                  )
              else:
                  marker = '<meta name="viewport" content="width=device-width,initial-scale=1">'
                  if marker in text:
                      text = text.replace(marker, marker + '\n' + csp, 1)
                  else:
                      text = re.sub(r'(<meta[^>]+viewport[^>]*>)', r'\1\n' + csp, text, count=1, flags=re.I)

              if 'name="referrer"' not in text and "name='referrer'" not in text:
                  marker = '<meta name="viewport" content="width=device-width,initial-scale=1">'
                  if marker in text:
                      text = text.replace(marker, marker + '\n' + referrer, 1)
                  else:
                      text = re.sub(r'(<meta[^>]+viewport[^>]*>)', r'\1\n' + referrer, text, count=1, flags=re.I)

              text = text.replace('http://avbusraturunc.com', 'https://avbusraturunc.com')
              text = text.replace('http://www.avbusraturunc.com', 'https://www.avbusraturunc.com')

              def harden_anchor(match):
                  tag = match.group(0)
                  if not re.search(r'target\s*=\s*["\']_blank["\']', tag, re.I):
                      return tag
                  relm = re.search(r'rel\s*=\s*(["\'])(.*?)\1', tag, re.I)
                  if relm:
                      vals = relm.group(2).split()
                      for token in ('noopener','noreferrer'):
                          if token not in vals:
                              vals.append(token)
                      replacement = 'rel=' + relm.group(1) + ' '.join(vals) + relm.group(1)
                      return tag[:relm.start()] + replacement + tag[relm.end():]
                  return tag[:-1] + ' rel="noopener noreferrer">'

              text = re.sub(r'<a\b[^>]*>', harden_anchor, text, flags=re.I)

              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(p.name)

          print('Audited:', ', '.join(audited))
          print('Changed:', ', '.join(changed) if changed else 'none')
          PY

      - name: Verify baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          problems=[]
          html_files=sorted(Path('.').glob('*.html'))
          text_files=html_files + sorted(Path('.').glob('*.js')) + sorted(Path('.').glob('*.css'))

          required_pages = {
              'kvkk-aydinlatma-metni.html': ('KVKK', '6698'),
              'gizlilik-cerez-politikasi.html': ('Gizlilik', 'Çerez'),
              'iletisim.html': ('İletişim', 'tel:+905533218593'),
              '404.html': ('noindex', 'Sayfa bulunamadı'),
          }
          for name, markers in required_pages.items():
              p=Path(name)
              if not p.exists():
                  problems.append(f'{name}: zorunlu hukuk/güvenlik sayfası eksik')
                  continue
              body=p.read_text(encoding='utf-8')
              for marker in markers:
                  if marker.lower() not in body.lower():
                      problems.append(f'{name}: beklenen içerik eksik -> {marker}')

          for p in html_files:
              t=p.read_text(encoding='utf-8')
              low=t.lower()
              if 'http-equiv="content-security-policy"' not in low:
                  problems.append(f'{p.name}: CSP meta eksik')
              if 'name="referrer"' not in low:
                  problems.append(f'{p.name}: referrer policy eksik')
              if "script-src 'self' 'unsafe-inline'" in t or "style-src 'self' 'unsafe-inline'" in t:
                  problems.append(f'{p.name}: CSP unsafe-inline içeriyor')
              if "frame-src 'none'" not in t:
                  problems.append(f'{p.name}: CSP frame-src none eksik')
              if "object-src 'none'" not in t:
                  problems.append(f'{p.name}: CSP object-src none eksik')
              if 'googletagmanager.com' in low or 'google-analytics.com' in low:
                  problems.append(f'{p.name}: gereksiz Google analytics/tag manager kaynağı kaldı')
              if '<iframe' in low:
                  problems.append(f'{p.name}: üçüncü taraf iframe kaldı')
              for a in re.findall(r'<a\b[^>]*target=["\']_blank["\'][^>]*>', t, flags=re.I):
                  if not re.search(r'rel=["\'][^"\']*noopener', a, flags=re.I):
                      problems.append(f'{p.name}: target=_blank noopener eksik')
                  if not re.search(r'rel=["\'][^"\']*noreferrer', a, flags=re.I):
                      problems.append(f'{p.name}: target=_blank noreferrer eksik')
              if re.search(r'(?:href|src|action)\s*=\s*["\']\s*javascript:', t, flags=re.I):
                  problems.append(f'{p.name}: javascript: URL bulundu')
              if re.search(r'(?:href|src|action)\s*=\s*["\']http://', t, flags=re.I):
                  problems.append(f'{p.name}: güvensiz HTTP bağlantısı/kaynağı bulundu')
              if re.search(r'<(?:object|embed|applet)\b', t, flags=re.I):
                  problems.append(f'{p.name}: object/embed/applet etiketi bulundu')
              for src in re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']', t, flags=re.I):
                  if src.startswith(('script.js','home-polish.js','analytics.js','infaz-hesaplama-events.js','infaz-hesaplama.runtime-','./','/')):
                      continue
                  problems.append(f'{p.name}: izin verilmeyen dış script: {src}')

          # Contact page must remain form-free unless a dedicated KVKK-compliant
          # collection/consent flow is deliberately introduced.
          contact=Path('iletisim.html').read_text(encoding='utf-8') if Path('iletisim.html').exists() else ''
          if re.search(r'<form\b', contact, flags=re.I):
              problems.append('iletisim.html: kişisel veri toplayan form beklenmedik şekilde eklendi')

          # Privacy-first analytics must remain disabled by default.
          analytics=Path('analytics.js')
          if not analytics.exists():
              problems.append('analytics.js: privacy gate dosyası eksik')
          else:
              a=analytics.read_text(encoding='utf-8')
              if 'window.ercakirAnalyticsEnabled = false;' not in a:
                  problems.append('analytics.js: analytics varsayılan kapalı değil')
              if re.search(r'\bgtag\s*\(', a, flags=re.I):
                  problems.append('analytics.js: doğrudan gtag çağrısı bulundu')

          # Responsible disclosure files must be complete and canonical.
          sec=Path('.well-known/security.txt')
          if not sec.exists():
              problems.append('.well-known/security.txt: eksik')
          else:
              s=sec.read_text(encoding='utf-8')
              for marker in (
                  'Contact: https://avbusraturunc.com/#iletisim',
                  'Canonical: https://avbusraturunc.com/.well-known/security.txt',
                  'Policy: https://avbusraturunc.com/SECURITY.md',
                  'Expires:'
              ):
                  if marker not in s:
                      problems.append(f'.well-known/security.txt: eksik alan -> {marker}')
          if not Path('SECURITY.md').exists():
              problems.append('SECURITY.md: sorumlu bildirim politikası eksik')

          # Homepage must expose the legal/privacy pages either statically or via
          # its deliberately loaded first-party footer script.
          home=Path('index.html').read_text(encoding='utf-8')
          polish=Path('home-polish.js').read_text(encoding='utf-8') if Path('home-polish.js').exists() else ''
          combined=home + '\n' + polish
          for target in ('iletisim.html','kvkk-aydinlatma-metni.html','gizlilik-cerez-politikasi.html'):
              if target not in combined:
                  problems.append(f'homepage footer/legal navigation eksik -> {target}')

          for p in text_files:
              t=p.read_text(encoding='utf-8')
              if 'http://avbusraturunc.com' in t or 'http://www.avbusraturunc.com' in t:
                  problems.append(f'{p.name}: site içi HTTP alan adı bulundu')

          if problems:
              print('\n'.join(sorted(set(problems))))
              sys.exit(1)
          print('Extended security, KVKK and privacy verification passed.')
          PY

      - name: Commit hardened pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Harden privacy and security metadata across site"
          git push
