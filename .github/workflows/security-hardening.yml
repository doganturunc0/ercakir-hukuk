name: Site-wide security hardening

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "SECURITY.md"
      - "security.txt"
      - ".well-known/security.txt"
      - ".github/workflows/security-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Audit and harden HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          csp_default = "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests\">"
          csp_home = "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests\">"
          referrer='<meta name="referrer" content="strict-origin-when-cross-origin">'; changed=[]
          for p in sorted(Path('.').glob('*.html')):
              text=p.read_text(encoding='utf-8'); original=text
              text=re.sub(r'\s*<!--\s*Google tag \(gtag\.js\)\s*-->\s*','\n',text,flags=re.I)
              text=re.sub(r'\s*<script\b[^>]*src=["\']https://www\.googletagmanager\.com/gtag/js\?id=G-1E6W6P6281["\'][^>]*>\s*</script>\s*','\n',text,flags=re.I)
              text=re.sub(r'("postalCode"\s*:\s*")45120(")',r'\g<1>45300\2',text)
              text=text.replace('45120 Salihli / Manisa','45300 Salihli / Manisa')
              csp=csp_home if p.name=='index.html' else csp_default; csp_re=r'<meta\b[^>]*http-equiv=["\']Content-Security-Policy["\'][^>]*>'
              if re.search(csp_re,text,re.I): text=re.sub(csp_re,csp,text,count=1,flags=re.I)
              else:
                  viewport=re.search(r'<meta\b[^>]*name=["\']viewport["\'][^>]*>',text,re.I); charset=re.search(r'<meta\b[^>]*charset=[^>]*>',text,re.I); anchor=viewport or charset
                  if anchor: text=text[:anchor.end()]+'\n'+csp+text[anchor.end():]
                  else: text=text.replace('<head>','<head>\n'+csp,1)
              if not re.search(r'<meta\b[^>]*name=["\']referrer["\'][^>]*>',text,re.I):
                  viewport=re.search(r'<meta\b[^>]*name=["\']viewport["\'][^>]*>',text,re.I)
                  if viewport: text=text[:viewport.end()]+'\n'+referrer+text[viewport.end():]
                  else: text=text.replace('<head>','<head>\n'+referrer,1)
              text=text.replace('http://avbusraturunc.com','https://avbusraturunc.com').replace('http://www.avbusraturunc.com','https://www.avbusraturunc.com')
              def harden_anchor(m):
                  tag=m.group(0)
                  if not re.search(r'target\s*=\s*["\']_blank["\']',tag,re.I): return tag
                  relm=re.search(r'rel\s*=\s*(["\'])(.*?)\1',tag,re.I)
                  if relm:
                      vals=relm.group(2).split()
                      for token in ('noopener','noreferrer'):
                          if token not in vals: vals.append(token)
                      replacement='rel='+relm.group(1)+' '.join(vals)+relm.group(1)
                      return tag[:relm.start()]+replacement+tag[relm.end():]
                  return tag[:-1]+' rel="noopener noreferrer">'
              text=re.sub(r'<a\b[^>]*>',harden_anchor,text,flags=re.I)
              if text!=original: p.write_text(text,encoding='utf-8'); changed.append(p.name)
          print('Changed:', ', '.join(changed) if changed else 'none')
          PY
      - name: Verify baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re, sys
          problems=[]; html_files=sorted(Path('.').glob('*.html'))
          required={'kvkk-aydinlatma-metni.html':('KVKK','6698'),'gizlilik-cerez-politikasi.html':('Gizlilik','Çerez'),'iletisim.html':('İletişim','tel:+905533218593'),'404.html':('noindex','Sayfa bulunamadı')}
          for name,markers in required.items():
              p=Path(name)
              if not p.exists(): problems.append(f'{name}: zorunlu sayfa eksik'); continue
              body=p.read_text(encoding='utf-8')
              for marker in markers:
                  if marker.lower() not in body.lower(): problems.append(f'{name}: beklenen içerik eksik -> {marker}')
          for p in html_files:
              t=p.read_text(encoding='utf-8'); low=t.lower()
              if ' aramasıyla ' in low: problems.append(f'{p.name}: yapay arama-kalıbı bulundu')
              if 'http-equiv="content-security-policy"' not in low: problems.append(f'{p.name}: CSP meta eksik')
              if 'name="referrer"' not in low: problems.append(f'{p.name}: referrer policy eksik')
              if "object-src 'none'" not in t: problems.append(f'{p.name}: object-src none eksik')
              if '45120' in t: problems.append(f'{p.name}: eski büro posta kodu 45120')
              if p.name=='index.html':
                  if 'frame-src https://www.google.com https://maps.google.com' not in t: problems.append('index.html: Maps CSP izni eksik')
                  if 'ga-consent.js' not in low: problems.append('index.html: consent analytics betiği eksik')
                  if re.search(r'<script\b[^>]*src=["\']https://www\.googletagmanager\.com/gtag/js',t,re.I): problems.append('index.html: statik Google tag loader bulundu')
                  for src in re.findall(r'<iframe\b[^>]*\bsrc=["\']([^"\']+)["\']',t,re.I):
                      u=urlparse(src)
                      if u.scheme!='https' or u.netloc not in ('www.google.com','maps.google.com'): problems.append(f'index.html: izin verilmeyen iframe -> {src}')
              else:
                  if "frame-src 'none'" not in t: problems.append(f'{p.name}: frame-src none eksik')
                  if '<iframe' in low: problems.append(f'{p.name}: beklenmeyen iframe')
                  if 'googletagmanager.com' in low or 'google-analytics.com' in low: problems.append(f'{p.name}: consent dışı analytics kaynağı')
              for a in re.findall(r'<a\b[^>]*target=["\']_blank["\'][^>]*>',t,re.I):
                  if not re.search(r'rel=["\'][^"\']*noopener',a,re.I): problems.append(f'{p.name}: noopener eksik')
                  if not re.search(r'rel=["\'][^"\']*noreferrer',a,re.I): problems.append(f'{p.name}: noreferrer eksik')
              if re.search(r'(?:href|src|action)\s*=\s*["\']\s*javascript:',t,re.I): problems.append(f'{p.name}: javascript URL')
              if re.search(r'(?:href|src|action)\s*=\s*["\']http://',t,re.I): problems.append(f'{p.name}: HTTP kaynak')
          contact=Path('iletisim.html').read_text(encoding='utf-8')
          if re.search(r'<form\b',contact,re.I): problems.append('iletisim.html: beklenmeyen form')
          if not Path('.well-known/security.txt').exists(): problems.append('.well-known/security.txt: eksik')
          if not Path('SECURITY.md').exists(): problems.append('SECURITY.md: eksik')
          if problems: print('\n'.join(sorted(set(problems)))); sys.exit(1)
          print('Extended security, KVKK, privacy, NAP and Maps verification passed.')
          PY
      - name: Commit hardened pages
        shell: bash
        run: |
          if git diff --quiet; then echo "No HTML changes needed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Normalize office postal code and security metadata"
          git push
