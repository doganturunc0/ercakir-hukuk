name: Live response security audit

on:
  workflow_run:
    workflows: ["Deploy Erçakır Hukuk site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check HTTP redirect and HTTPS response headers
        shell: bash
        run: |
          set -euo pipefail

          echo "== HTTP redirect =="
          curl -sS --max-time 20 -o /dev/null -D http-headers.txt http://avbusraturunc.com/
          cat http-headers.txt

          echo "== HTTPS final response =="
          curl -sS --max-time 20 -L -o /dev/null -D redirect-chain.txt https://avbusraturunc.com/
          cat redirect-chain.txt

          python3 - <<'PY'
          from pathlib import Path
          import re

          http = Path('http-headers.txt').read_text(errors='replace')
          chain = Path('redirect-chain.txt').read_text(errors='replace')
          blocks = [b.strip() for b in re.split(r'\r?\n\r?\n', chain) if b.strip().startswith('HTTP/')]
          final = blocks[-1] if blocks else chain

          def headers(block):
              out = {}
              for line in block.splitlines()[1:]:
                  if ':' in line:
                      k, v = line.split(':', 1)
                      out[k.strip().lower()] = v.strip()
              return out

          h = headers(final)
          required = {
              'strict-transport-security': 'HSTS',
              'x-content-type-options': 'MIME sniffing protection',
              'referrer-policy': 'Referrer Policy',
              'permissions-policy': 'Permissions Policy',
          }
          frame_ok = 'x-frame-options' in h or ('content-security-policy' in h and 'frame-ancestors' in h['content-security-policy'].lower())

          report = []
          report.append('## Live response security audit')
          report.append('')
          report.append('| Control | Result |')
          report.append('|---|---|')
          for key, label in required.items():
              value = h.get(key)
              report.append(f'| {label} | {"✅ " + value if value else "⚠️ Missing"} |')
          report.append(f'| Clickjacking response protection | {"✅ Present" if frame_ok else "⚠️ Missing X-Frame-Options / CSP frame-ancestors"} |')
          acao = h.get('access-control-allow-origin')
          report.append(f'| Access-Control-Allow-Origin | {acao if acao is not None else "Not present"} |')

          http_status = http.splitlines()[0] if http.splitlines() else ''
          location = headers(http).get('location','')
          redirect_ok = bool(re.search(r'HTTP/\S+\s+30[1278]\b', http_status)) and location.lower().startswith('https://')
          report.append(f'| HTTP → HTTPS | {"✅ " + http_status + " → " + location if redirect_ok else "❌ Redirect problem"} |')

          print('\n'.join(report))
          summary = Path('/tmp/live-security-summary.md')
          summary.write_text('\n'.join(report) + '\n', encoding='utf-8')

          if not redirect_ok:
              raise SystemExit('HTTP endpoint is not safely redirecting to HTTPS')
          PY

          cat /tmp/live-security-summary.md >> "$GITHUB_STEP_SUMMARY"
