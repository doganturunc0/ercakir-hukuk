name: Normalize HTML head metadata

on:
  push:
    paths:
      - '.github/workflows/add-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-heads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize analytics and favicon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          measurement_id = 'G-1E6W6P6281'
          analytics = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-1E6W6P6281"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-1E6W6P6281');
          </script>'''

          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              original = s

              if measurement_id not in s and '<head>' in s:
                  s = s.replace('<head>', '<head>\n' + analytics, 1)

              if 'rel="icon"' not in s:
                  marker = '<meta name="viewport" content="width=device-width,initial-scale=1">'
                  if marker in s:
                      s = s.replace(
                          marker,
                          marker + '\n<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">\n<link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml">',
                          1,
                      )

              if s != original:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SEO: apply GA4 tracking and favicon consistently"
          git push
