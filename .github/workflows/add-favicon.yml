name: Normalize HTML head metadata

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '.github/workflows/add-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-heads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize analytics, favicons, social metadata and links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          measurement_id = 'G-1E6W6P6281'
          analytics = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-1E6W6P6281"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-1E6W6P6281');
          </script>'''

          def meta_content(source, pattern, fallback=''):
              m = re.search(pattern, source, flags=re.I | re.S)
              return html.unescape(m.group(1).strip()) if m else fallback

          def esc_attr(value):
              return html.escape(value, quote=True)

          def normalize_anchor(match):
              attrs = match.group('attrs')
              body = match.group('body')
              new_attrs = attrs

              if re.search(r'\btarget=["\']_blank["\']', attrs, flags=re.I):
                  rel = re.search(r'\brel=["\']([^"\']*)["\']', attrs, flags=re.I)
                  if rel:
                      tokens = rel.group(1).split()
                      for token in ('noopener', 'noreferrer'):
                          if token not in tokens:
                              tokens.append(token)
                      new_attrs = new_attrs[:rel.start()] + f'rel="{" ".join(tokens)}"' + new_attrs[rel.end():]
                  else:
                      new_attrs += ' rel="noopener noreferrer"'

              if not re.search(r'\btitle\s*=', new_attrs, flags=re.I):
                  text = re.sub(r'<[^>]+>', ' ', body)
                  text = html.unescape(re.sub(r'\s+', ' ', text)).strip()
                  if text:
                      new_attrs += f' title="{esc_attr(text[:160])}"'

              return f'<a{new_attrs}>{body}</a>'

          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              original = s

              if measurement_id not in s and '<head>' in s:
                  s = s.replace('<head>', '<head>\n' + analytics, 1)

              viewport = '<meta name="viewport" content="width=device-width,initial-scale=1">'
              if viewport in s and 'href="/favicon.ico"' not in s and 'href="https://avbusraturunc.com/favicon.ico"' not in s:
                  s = s.replace(viewport, viewport + '\n<link rel="icon" href="/favicon.ico" sizes="any">', 1)

              if 'rel="icon"' not in s:
                  marker = viewport
                  if marker in s:
                      s = s.replace(marker, marker + '\n<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">\n<link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml">', 1)

              if 'name="format-detection"' not in s and '</head>' in s:
                  s = s.replace('</head>', '<meta name="format-detection" content="telephone=yes">\n</head>', 1)

              title = meta_content(s, r'<title>(.*?)</title>', 'Erçakır Hukuk Bürosu | Salihli, Manisa')
              description = meta_content(s, r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', 'Salihli, Manisa merkezli Erçakır Hukuk Bürosu hukuki bilgilendirme sayfası.')
              image = meta_content(s, r'<meta\s+property=["\']og:image["\']\s+content=["\'](.*?)["\']', 'https://avbusraturunc.com/assets/hero-main.webp')

              if 'name="twitter:card"' not in s and '</head>' in s:
                  twitter = (
                      '<meta name="twitter:card" content="summary_large_image">\n'
                      f'<meta name="twitter:title" content="{esc_attr(title)}">\n'
                      f'<meta name="twitter:description" content="{esc_attr(description)}">\n'
                      f'<meta name="twitter:image" content="{esc_attr(image)}">\n'
                  )
                  s = s.replace('</head>', twitter + '</head>', 1)

              if 'property="og:image:alt"' not in s and 'property="og:image"' in s:
                  s = s.replace('</head>', '<meta property="og:image:alt" content="Erçakır Hukuk Bürosu - Salihli, Manisa">\n</head>', 1)

              s = re.sub(r'<a(?P<attrs>[^>]*)>(?P<body>.*?)</a>', normalize_anchor, s, flags=re.I | re.S)

              if s != original:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SEO: normalize metadata, favicon fallback and link attributes"
          git push
