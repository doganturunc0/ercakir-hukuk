name: Add static legal content showcase

on:
  push:
    paths:
      - '.github/workflows/static-home-content.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add static legal content section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if not s.strip():
              raise SystemExit('index.html is empty; refusing to write')

          nav_old = '<a href="#makaleler">Bilgilendirmeler</a><a href="#iletisim">İletişim</a>'
          nav_new = '<a href="#makaleler">Bilgilendirmeler</a><a href="#hukuki-icerikler-home">Hukuki İçerikler</a><a href="#iletisim">İletişim</a>'
          if '#hukuki-icerikler-home' not in s:
              if nav_old not in s:
                  raise SystemExit('Navigation anchor not found')
              s = s.replace(nav_old, nav_new, 1)

          if 'id="hukuki-icerikler-home"' not in s:
              anchor = '<section class="home-faq" id="sss">'
              if anchor not in s:
                  raise SystemExit('FAQ anchor not found')
              section = '''<section class="legal-content-showcase" id="hukuki-icerikler-home">
<div class="legal-content-inner">
<div class="legal-content-heading"><p class="eyebrow">HUKUKİ İÇERİKLER</p><h2>Ayrıntılı hukuki içerikler.</h2><p>Belirli hukuki konuların mevzuat ve uygulama çerçevesinde ele alındığı yazılar.</p></div>
<div class="legal-content-grid">
<a class="legal-content-card" href="tutuklama-kararina-itiraz.html" aria-label="Tutuklama Kararına İtiraz ve Tutukluluğun İncelenmesi içeriğini aç">
<div class="legal-content-cover"><span>CEZA MUHAKEMESİ</span><div class="cover-mark">ER</div><small>ERÇAKIR HUKUK BÜROSU</small></div>
<div class="legal-content-body"><span>CEZA HUKUKU</span><h3>Tutuklama Kararına İtiraz ve Tutukluluğun İncelenmesi</h3><p>Tutuklama koşulları, itiraz süresi, tahliye talebi, tutukluluğun incelenmesi, ölçülülük ve adli kontrol başlıklarının genel çerçevesi.</p><b>İçeriği oku →</b></div>
</a>
</div>
<a class="all-articles-link" href="hukuki-icerikler.html">Tüm hukuki içerikler →</a>
</div>
</section>
'''
              s = s.replace(anchor, section + anchor, 1)

          if 'STATIC LEGAL CONTENT SHOWCASE' not in s:
              css = '''\n<style>/* STATIC LEGAL CONTENT SHOWCASE */
.legal-content-showcase{padding:82px max(6vw,24px);background:#f5f1e9;border-top:1px solid #d9d0c1;border-bottom:1px solid #d9d0c1}.legal-content-inner{max-width:1240px;margin:auto}.legal-content-heading{max-width:760px;margin-bottom:34px}.legal-content-heading h2{font-family:Georgia,serif;font-size:clamp(2rem,4vw,3.6rem);font-weight:400;line-height:1.06;margin:10px 0 14px;color:#24231f}.legal-content-heading>p:last-child{line-height:1.75;color:#625e56}.legal-content-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.legal-content-card{display:grid;grid-template-columns:42% 58%;grid-column:span 2;min-height:300px;background:#fff;color:inherit;text-decoration:none;border:1px solid #d8d0c2;box-shadow:0 18px 45px rgba(27,34,36,.08);transition:transform .2s ease,box-shadow .2s ease}.legal-content-card:hover{transform:translateY(-4px);box-shadow:0 24px 55px rgba(27,34,36,.13)}.legal-content-cover{background:linear-gradient(145deg,#0c3040,#174b5c);padding:28px;color:#f6f0e5;display:flex;flex-direction:column;justify-content:space-between;min-height:300px}.legal-content-cover>span{font:700 .72rem Arial,sans-serif;letter-spacing:.14em;color:#d0aa67}.cover-mark{width:74px;height:74px;border:1px solid #c8a365;border-radius:50%;display:grid;place-items:center;font:400 2rem Georgia,serif;color:#d8b779}.legal-content-cover small{font:700 .66rem Arial,sans-serif;letter-spacing:.12em}.legal-content-body{padding:34px;display:flex;flex-direction:column}.legal-content-body>span{font:700 .7rem Arial,sans-serif;letter-spacing:.12em;color:#9b753d}.legal-content-body h3{font:400 clamp(1.5rem,2.4vw,2.2rem) Georgia,serif;line-height:1.12;margin:15px 0;color:#24231f}.legal-content-body p{line-height:1.7;color:#625e56;margin:0 0 22px}.legal-content-body b{margin-top:auto;color:#9b753d;font:700 .84rem Arial,sans-serif}.legal-content-showcase .all-articles-link{display:inline-block;margin-top:28px;font-weight:700;text-decoration:none;color:#24231f;border-bottom:1px solid currentColor;padding-bottom:4px}@media(max-width:800px){.legal-content-showcase{padding:58px 20px}.legal-content-grid{grid-template-columns:1fr}.legal-content-card{grid-column:auto;grid-template-columns:1fr}.legal-content-cover{min-height:210px}.legal-content-body{padding:26px}}
</style>\n'''
              if '</head>' not in s:
                  raise SystemExit('head closing tag not found')
              s = s.replace('</head>', css + '</head>', 1)

          s = s.replace('home-polish.js?v=20260828-16','home-polish.js?v=20260828-21')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hukuki içerikler vitrinini ana sayfaya sabit ekle"
          git push origin HEAD:main
