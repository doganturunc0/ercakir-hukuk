name: Browser Smoke Audit

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/browser-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@1e60f620b9541d17b7cba2b2ec76eebd18b2c891
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser smoke audit
        run: node scripts/browser-smoke.mjs

# Chromium smoke coverage for mobile/desktop homepage, tools, content hub and all editorial articles.
