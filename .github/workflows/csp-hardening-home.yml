name: Homepage CSP hardening

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/csp-hardening-home.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsafe inline dependencies on homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          t=p.read_text(encoding='utf-8')

          # Remove duplicate inline GA bootstrap; script.js already performs GA initialization.
          t=re.sub(r'<script>\s*window\.dataLayer = window\.dataLayer \|\| \[\];.*?gtag\(\x27config\x27, \x27G-1E6W6P6281\x27\);\s*</script>\s*', '', t, count=1, flags=re.S)

          # Move the homepage-only inline style block into the existing first-party stylesheet.
          m=re.search(r'<style>\s*(.*?)\s*</style>', t, flags=re.S|re.I)
          if m:
              css=m.group(1).strip()
              site=Path('site.css')
              current=site.read_text(encoding='utf-8')
              marker='/* homepage-csp-extracted */'
              if marker not in current:
                  site.write_text(current.rstrip()+f'\n\n{marker}\n{css}\n', encoding='utf-8')
              t=t[:m.start()]+t[m.end():]

          # Replace inline calculator event handlers with data attributes.
          funcs=['calcKidem','calcIhbar','calcMesai','calcIzin','calcFaiz']
          for f in funcs:
              t=t.replace(f'onclick="{f}()"', f'data-calc-action="{f}"')

          # Tighten homepage CSP: no arbitrary inline JS or CSS.
          t=t.replace("script-src 'self' 'unsafe-inline' https://www.googletagmanager.com", "script-src 'self' https://www.googletagmanager.com")
          t=t.replace("style-src 'self' 'unsafe-inline'", "style-src 'self'")

          # Explicit author metadata for tools that do not infer Person JSON-LD.
          if '<meta name="author"' not in t:
              t=t.replace('<meta name="description"', '<meta name="author" content="Av. Büşra Turunç">\n<meta name="description"', 1)

          p.write_text(t,encoding='utf-8')

          js=Path('script.js')
          s=js.read_text(encoding='utf-8')
          marker='/* CSP-safe calculator bindings */'
          if marker not in s:
              s += "\n"+marker+"\ndocument.querySelectorAll('[data-calc-action]').forEach(btn=>btn.addEventListener('click',()=>{const fn=window[btn.dataset.calcAction];if(typeof fn==='function')fn()}));\n"
              js.write_text(s,encoding='utf-8')
          PY

      - name: Verify strict homepage CSP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          t=Path('index.html').read_text(encoding='utf-8')
          problems=[]
          csp=re.search(r'<meta http-equiv="Content-Security-Policy" content="([^"]+)"',t)
          if not csp: problems.append('CSP missing')
          elif "'unsafe-inline'" in csp.group(1): problems.append('unsafe-inline remains in homepage CSP')
          if re.search(r'\son[a-z]+\s*=',t,re.I): problems.append('inline event handler remains')
          for m in re.finditer(r'<script(?![^>]*\bsrc=)([^>]*)>(.*?)</script>',t,re.S|re.I):
              attrs=m.group(1).lower()
              if 'application/ld+json' not in attrs and m.group(2).strip(): problems.append('executable inline script remains')
          if '<style' in t.lower(): problems.append('inline style block remains')
          if problems:
              print('\n'.join(problems));sys.exit(1)
          print('Homepage strict CSP verification passed.')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site.css script.js
          git diff --cached --quiet && exit 0
          git commit -m "Harden homepage CSP without changing SEO content"
          git push
