name: Apply verified Seobaz SEO improvements once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seobaz-seo-apply-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply conservative local SEO metadata improvements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from datetime import date

          targets = {
            'index.html': {
              'title': 'Salihli Avukat | Av. Büşra Turunç | Erçakır Hukuk Bürosu',
              'h1_old': 'Av. Büşra Turunç · Erçakır Hukuk Bürosu · Salihli, Manisa',
              'h1_new': 'Avukat Büşra Turunç · Erçakır Hukuk Bürosu · Salihli, Manisa',
              'desc': "Salihli, Manisa'da Avukat Büşra Turunç ve Erçakır Hukuk Bürosu; çalışma alanları, hukuki bilgilendirmeler, hesaplama araçları ve iletişim bilgileri."
            },
            'ceza-hukuku.html': {
              'title': 'Salihli Ceza Avukatı | Ceza Hukuku | Av. Büşra Turunç',
              'h1_old': 'Ceza hukuku ve ceza yargılaması | Salihli, Manisa',
              'h1_new': 'Salihli Ceza Avukatı ve Ceza Hukuku',
              'desc': "Salihli ceza avukatı ve ceza hukuku hakkında; soruşturma, tutuklama, ağır ceza yargılaması, kanun yolları ve infaz süreçlerine ilişkin genel bilgi."
            },
            'aile-bosanma-hukuku.html': {
              'title': 'Salihli Boşanma Avukatı | Aile Hukuku | Av. Büşra Turunç',
              'h1_old': 'Aile ve boşanma hukuku | Salihli, Manisa',
              'h1_new': 'Salihli Boşanma Avukatı ve Aile Hukuku',
              'desc': "Salihli boşanma avukatı ve aile hukuku hakkında; boşanma, velayet, nafaka, mal rejimi ve 6284 kapsamındaki süreçlere ilişkin genel hukuki bilgi."
            },
            'is-hukuku.html': {
              'title': 'Salihli İş Avukatı | İş Hukuku | Av. Büşra Turunç',
              'h1_old': 'İş hukuku | Salihli, Manisa',
              'h1_new': 'Salihli İş Avukatı ve İş Hukuku',
              'desc': "Salihli iş avukatı ve iş hukuku hakkında; işçilik alacakları, fesih, kıdem ve ihbar tazminatı, fazla çalışma ve işe iade süreçlerine ilişkin genel bilgi."
            },
            'icra-iflas-hukuku.html': {
              'title': 'Salihli İcra Avukatı | İcra ve İflas Hukuku | Av. Büşra Turunç',
              'h1_old': 'İcra ve iflas hukuku | Salihli, Manisa',
              'h1_new': 'Salihli İcra Avukatı ve İcra-İflas Hukuku',
              'desc': "Salihli icra avukatı ve icra-iflas hukuku hakkında; takip, itiraz, haciz, menfi tespit ve alacak uyuşmazlıklarına ilişkin genel hukuki bilgi."
            },
            'gayrimenkul-hukuku.html': {
              'title': 'Salihli Gayrimenkul Avukatı | Gayrimenkul Hukuku | Av. Büşra Turunç',
              'h1_old': 'Gayrimenkul hukuku | Salihli, Manisa',
              'h1_new': 'Salihli Gayrimenkul Avukatı ve Gayrimenkul Hukuku',
              'desc': "Salihli gayrimenkul avukatı ve gayrimenkul hukuku hakkında; tapu, mülkiyet, ortaklığın giderilmesi ve taşınmaz uyuşmazlıklarına ilişkin genel bilgi."
            },
            'miras-hukuku.html': {
              'title': 'Salihli Miras Avukatı | Miras Hukuku | Av. Büşra Turunç',
              'h1_old': 'Miras hukuku | Salihli, Manisa',
              'h1_new': 'Salihli Miras Avukatı ve Miras Hukuku',
              'desc': "Salihli miras avukatı ve miras hukuku hakkında; mirasçılık, tereke, saklı pay, tenkis ve miras paylaşımı uyuşmazlıklarına ilişkin genel hukuki bilgi."
            },
            'ticaret-hukuku.html': {
              'title': 'Salihli Ticaret Avukatı | Ticaret Hukuku | Av. Büşra Turunç',
              'h1_old': 'Ticaret hukuku | Salihli, Manisa',
              'h1_new': 'Salihli Ticaret Avukatı ve Ticaret Hukuku',
              'desc': "Salihli ticaret avukatı ve ticaret hukuku hakkında; ticari sözleşmeler, şirketler, ticari alacaklar ve arabuluculuk süreçlerine ilişkin genel bilgi."
            },
            'idare-hukuku.html': {
              'title': 'Salihli İdare Avukatı | İdare Hukuku | Av. Büşra Turunç',
              'h1_old': 'İdare hukuku | Salihli, Manisa',
              'h1_new': 'Salihli İdare Avukatı ve İdare Hukuku',
              'desc': "Salihli idare avukatı ve idare hukuku hakkında; idari işlemler, iptal davaları, yürütmenin durdurulması ve tam yargı süreçlerine ilişkin genel bilgi."
            },
            'kira-hukuku.html': {
              'title': 'Salihli Kira Avukatı | Kira Hukuku | Av. Büşra Turunç',
              'h1_old': 'Kira hukuku | Salihli, Manisa',
              'h1_new': 'Salihli Kira Avukatı ve Kira Hukuku',
              'desc': "Salihli kira avukatı ve kira hukuku hakkında; tahliye, kira bedeli, uyarlama, tahliye taahhüdü ve kira alacaklarına ilişkin genel hukuki bilgi."
            },
            'sigorta-hukuku.html': {
              'title': 'Salihli Sigorta Avukatı | Sigorta Hukuku | Av. Büşra Turunç',
              'h1_old': 'Sigorta hukuku | Salihli, Manisa',
              'h1_new': 'Salihli Sigorta Avukatı ve Sigorta Hukuku',
              'desc': "Salihli sigorta avukatı ve sigorta hukuku hakkında; sigorta sözleşmeleri, teminat, tazminat ve sigorta tahkim süreçlerine ilişkin genel hukuki bilgi."
            },
          }

          changed=[]
          for name, cfg in targets.items():
            p=Path(name)
            if not p.exists():
              raise SystemExit(f'Missing expected file: {name}')
            s=p.read_text(encoding='utf-8')
            old=s
            s=re.sub(r'<title>.*?</title>', f"<title>{cfg['title']}</title>", s, count=1, flags=re.S)
            s=re.sub(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{cfg["desc"]}">', s, count=1)
            s=re.sub(r'<meta property="og:title" content="[^"]*">', f'<meta property="og:title" content="{cfg["title"]}">', s, count=1)
            s=re.sub(r'<meta property="og:description" content="[^"]*">', f'<meta property="og:description" content="{cfg["desc"]}">', s, count=1)
            s=re.sub(r'<meta name="twitter:title" content="[^"]*">', f'<meta name="twitter:title" content="{cfg["title"]}">', s, count=1)
            s=re.sub(r'<meta name="twitter:description" content="[^"]*">', f'<meta name="twitter:description" content="{cfg["desc"]}">', s, count=1)
            if cfg['h1_old'] not in s:
              raise SystemExit(f'Expected H1 text not found in {name}: {cfg["h1_old"]}')
            s=s.replace(f'<h1>{cfg["h1_old"]}</h1>', f'<h1>{cfg["h1_new"]}</h1>', 1)
            # Keep WebPage schema names aligned where an exact old H1/name is present.
            s=s.replace(f'"name":"{cfg["h1_old"]}"', f'"name":"{cfg["h1_new"]}"')
            if s != old:
              p.write_text(s, encoding='utf-8')
              changed.append(name)

          # Refresh sitemap lastmod only for pages actually changed.
          sm=Path('sitemap.xml')
          text=sm.read_text(encoding='utf-8')
          today='2026-10-01'
          for name in changed:
            url='https://avbusraturunc.com/' if name=='index.html' else f'https://avbusraturunc.com/{name}'
            text=re.sub(rf'(<loc>{re.escape(url)}</loc><lastmod>)[^<]+(</lastmod>)', rf'\g<1>{today}\2', text)
          sm.write_text(text, encoding='utf-8')

          # Refresh llms review date without adding unsupported ranking claims.
          lp=Path('llms.txt')
          l=lp.read_text(encoding='utf-8')
          l=re.sub(r'Last reviewed: \d{4}-\d{2}-\d{2}', 'Last reviewed: 2026-10-01', l)
          lp.write_text(l, encoding='utf-8')

          print('Changed:', ', '.join(changed))
          PY
      - name: Validate changed HTML and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, xml.etree.ElementTree as ET
          targets=['index.html','ceza-hukuku.html','aile-bosanma-hukuku.html','is-hukuku.html','icra-iflas-hukuku.html','gayrimenkul-hukuku.html','miras-hukuku.html','ticaret-hukuku.html','idare-hukuku.html','kira-hukuku.html','sigorta-hukuku.html']
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.h1=0; self.title=[]; self.desc=[]; self.canonical=[]; self.og=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='h1': self.h1+=1
              if tag=='meta' and a.get('name')=='description': self.desc.append(a.get('content',''))
              if tag=='meta' and a.get('property')=='og:title': self.og.append(a.get('content',''))
              if tag=='link' and a.get('rel')=='canonical': self.canonical.append(a.get('href',''))
            def handle_data(self,data): pass
          errors=[]
          for f in targets:
            s=Path(f).read_text(encoding='utf-8')
            p=P(); p.feed(s)
            title=re.findall(r'<title>(.*?)</title>',s,re.S)
            if len(title)!=1: errors.append(f'{f}: title count {len(title)}')
            if len(p.desc)!=1: errors.append(f'{f}: description count {len(p.desc)}')
            if p.h1!=1: errors.append(f'{f}: H1 count {p.h1}')
            if len(p.canonical)!=1: errors.append(f'{f}: canonical count {len(p.canonical)}')
            if len(p.og)!=1: errors.append(f'{f}: og:title count {len(p.og)}')
            if title and 'Avukat' not in title[0]: errors.append(f'{f}: title lacks Avukat')
            if p.desc and not (110 <= len(p.desc[0]) <= 175): errors.append(f'{f}: description length {len(p.desc[0])}')
          ET.parse('sitemap.xml')
          if errors:
            raise SystemExit('\n'.join(errors))
          print('Conservative SEO validation passed for', len(targets), 'pages')
          PY
      - name: Commit applied changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ceza-hukuku.html aile-bosanma-hukuku.html is-hukuku.html icra-iflas-hukuku.html gayrimenkul-hukuku.html miras-hukuku.html ticaret-hukuku.html idare-hukuku.html kira-hukuku.html sigorta-hukuku.html sitemap.xml llms.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Improve local SEO query alignment and metadata [skip ci]'
          git push origin main
