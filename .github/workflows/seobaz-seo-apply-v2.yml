name: Apply verified Seobaz SEO improvements v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seobaz-seo-apply-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified metadata improvements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = {
            'index.html': ('Salihli Avukat | Av. Büşra Turunç | Erçakır Hukuk Bürosu', "Salihli, Manisa'da Avukat Büşra Turunç ve Erçakır Hukuk Bürosu; çalışma alanları, hukuki bilgilendirmeler, hesaplama araçları ve iletişim bilgileri."),
            'ceza-hukuku.html': ('Salihli Ceza Avukatı | Ceza Hukuku | Av. Büşra Turunç', 'Salihli ceza avukatı ve ceza hukuku hakkında; soruşturma, tutuklama, ağır ceza yargılaması, kanun yolları ve infaz süreçlerine ilişkin genel bilgi.'),
            'aile-bosanma-hukuku.html': ('Salihli Boşanma Avukatı | Aile Hukuku | Av. Büşra Turunç', 'Salihli boşanma avukatı ve aile hukuku hakkında; boşanma, velayet, nafaka, mal rejimi ve 6284 kapsamındaki süreçlere ilişkin genel hukuki bilgi.'),
            'is-hukuku.html': ('Salihli İş Avukatı | İş Hukuku | Av. Büşra Turunç', 'Salihli iş avukatı ve iş hukuku hakkında; işçilik alacakları, fesih, kıdem ve ihbar tazminatı, fazla çalışma ve işe iade süreçlerine ilişkin genel bilgi.'),
            'icra-iflas-hukuku.html': ('Salihli İcra Avukatı | İcra ve İflas Hukuku | Av. Büşra Turunç', 'Salihli icra avukatı ve icra-iflas hukuku hakkında; takip, itiraz, haciz, menfi tespit ve alacak uyuşmazlıklarına ilişkin genel hukuki bilgi.'),
            'gayrimenkul-hukuku.html': ('Salihli Gayrimenkul Avukatı | Gayrimenkul Hukuku | Av. Büşra Turunç', 'Salihli gayrimenkul avukatı ve gayrimenkul hukuku hakkında; tapu, mülkiyet, ortaklığın giderilmesi ve taşınmaz uyuşmazlıklarına ilişkin genel bilgi.'),
            'miras-hukuku.html': ('Salihli Miras Avukatı | Miras Hukuku | Av. Büşra Turunç', 'Salihli miras avukatı ve miras hukuku hakkında; mirasçılık, tereke, saklı pay, tenkis ve miras paylaşımı uyuşmazlıklarına ilişkin genel hukuki bilgi.'),
            'ticaret-hukuku.html': ('Salihli Ticaret Avukatı | Ticaret Hukuku | Av. Büşra Turunç', 'Salihli ticaret avukatı ve ticaret hukuku hakkında; ticari sözleşmeler, şirketler, ticari alacaklar ve arabuluculuk süreçlerine ilişkin genel bilgi.'),
            'idare-hukuku.html': ('Salihli İdare Avukatı | İdare Hukuku | Av. Büşra Turunç', 'Salihli idare avukatı ve idare hukuku hakkında; idari işlemler, iptal davaları, yürütmenin durdurulması ve tam yargı süreçlerine ilişkin genel bilgi.'),
            'kira-hukuku.html': ('Salihli Kira Avukatı | Kira Hukuku | Av. Büşra Turunç', 'Salihli kira avukatı ve kira hukuku hakkında; tahliye, kira bedeli, uyarlama, tahliye taahhüdü ve kira alacaklarına ilişkin genel hukuki bilgi.'),
            'sigorta-hukuku.html': ('Salihli Sigorta Avukatı | Sigorta Hukuku | Av. Büşra Turunç', 'Salihli sigorta avukatı ve sigorta hukuku hakkında; sigorta sözleşmeleri, teminat, tazminat ve sigorta tahkim süreçlerine ilişkin genel hukuki bilgi.'),
          }

          changed=[]
          for name,(title,desc) in targets.items():
            p=Path(name)
            s=p.read_text(encoding='utf-8')
            old=s
            s,n=re.subn(r'<title>.*?</title>', f'<title>{title}</title>', s, count=1, flags=re.S)
            if n != 1: raise SystemExit(f'{name}: title missing')
            replacements=[
              (r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{desc}">'),
              (r'<meta property="og:title" content="[^"]*">', f'<meta property="og:title" content="{title}">'),
              (r'<meta property="og:description" content="[^"]*">', f'<meta property="og:description" content="{desc}">'),
              (r'<meta name="twitter:title" content="[^"]*">', f'<meta name="twitter:title" content="{title}">'),
              (r'<meta name="twitter:description" content="[^"]*">', f'<meta name="twitter:description" content="{desc}">'),
            ]
            for pat,repl in replacements:
              s=re.sub(pat,repl,s,count=1)
            if s != old:
              p.write_text(s,encoding='utf-8')
              changed.append(name)

          sm=Path('sitemap.xml')
          text=sm.read_text(encoding='utf-8')
          for name in changed:
            url='https://avbusraturunc.com/' if name=='index.html' else f'https://avbusraturunc.com/{name}'
            text=re.sub(rf'(<loc>{re.escape(url)}</loc><lastmod>)[^<]+(</lastmod>)', rf'\g<1>2026-10-01\2', text)
          sm.write_text(text,encoding='utf-8')
          print('Changed:', ', '.join(changed))
          PY
      - name: Validate changed HTML and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          targets=['index.html','ceza-hukuku.html','aile-bosanma-hukuku.html','is-hukuku.html','icra-iflas-hukuku.html','gayrimenkul-hukuku.html','miras-hukuku.html','ticaret-hukuku.html','idare-hukuku.html','kira-hukuku.html','sigorta-hukuku.html']
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.h1=0; self.title=0; self.desc=0; self.canon=0
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='h1': self.h1+=1
              if tag=='title': self.title+=1
              if tag=='meta' and a.get('name')=='description': self.desc+=1
              if tag=='link' and a.get('rel')=='canonical': self.canon+=1
          for f in targets:
            p=P(); p.feed(Path(f).read_text(encoding='utf-8'))
            if (p.h1,p.title,p.desc,p.canon)!=(1,1,1,1): raise SystemExit(f'{f}: structural validation failed {(p.h1,p.title,p.desc,p.canon)}')
          ET.parse('sitemap.xml')
          print('Validation PASS')
          PY
      - name: Commit applied changes
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ceza-hukuku.html aile-bosanma-hukuku.html is-hukuku.html icra-iflas-hukuku.html gayrimenkul-hukuku.html miras-hukuku.html ticaret-hukuku.html idare-hukuku.html kira-hukuku.html sigorta-hukuku.html sitemap.xml
          git commit -m 'Apply verified local SEO metadata improvements'
          git push origin HEAD:main