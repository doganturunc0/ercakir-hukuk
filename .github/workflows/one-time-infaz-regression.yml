name: One-time infaz regression checks
on:
  push:
    paths:
      - '.github/workflows/one-time-infaz-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check infaz-hesaplama.runtime-1.js
      - name: Legal-rule regression guards
        shell: python
        run: |
          from pathlib import Path
          s=Path('infaz-hesaplama.runtime-1.js').read_text(encoding='utf-8')
          checks={
            '7593 exception list': "['kill','sexualBasic','sexualAggravated','drug188','organization']" in s,
            '7593 actual-age gate': 'ageAtStart<15' in s,
            '7593 not checkbox-only': 'child&&!child7593Exception(crime)' not in s.split('let ratio=')[0] or '(!birth||!start)' in s,
            'second recidivism 3/4': "Math.max(ratio,3/4)" in s,
            'first recidivism minimum 2/3': "Math.max(ratio,2/3)" in s,
            '105A ten-percent effective date': "2025-06-04T00:00:00" in s,
            'legacy DS safety stop': "2023-07-31T23:59:59" in s and 'Denetimli serbestlik tarihi otomatik üretilmedi.' in s,
            'special unsupported UI removed': "['womanChild','age70','illness']" in s,
            'birth/crime consistency': 'Doğum tarihi suç tarihinden sonra olamaz.' in s,
            '105A eligibility disclaimer': 'açık kurum/çocuk eğitimevi statüsü, iyi hâl ve infaz hâkimi değerlendirmesine bağlıdır' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS' if v else 'FAIL'),k)
          if bad: raise SystemExit('Failed: '+', '.join(bad))
      - name: HTML wiring guards
        shell: python
        run: |
          from pathlib import Path
          h=Path('infaz-hesaplama.html').read_text(encoding='utf-8')
          for token in ['crimeType','crimeDate','birthDate','startDate','childOffender','recidivist','secondRecidivist','calculateBtn','resetBtn']:
              assert f'id="{token}"' in h, token
          assert 'infaz-hesaplama.runtime-1.js' in h, 'runtime script is not wired into HTML'
          print('PASS HTML inputs and runtime wiring')