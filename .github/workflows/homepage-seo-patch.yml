name: Patch homepage SEO heading

on:
  push:
    paths:
      - '.github/workflows/homepage-seo-patch.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update homepage H1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<h1>Hukuki süreçler hakkında genel bilgilendirme ve dosya bazlı değerlendirme.</h1>'
          new = '<h1>Av. Büşra Turunç · Erçakır Hukuk Bürosu · Salihli, Manisa</h1>'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected homepage H1 was not found; refusing unsafe replacement.')
          PY

      - name: Commit change when needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Homepage H1 already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'seo: strengthen homepage entity and local H1'
          git push
