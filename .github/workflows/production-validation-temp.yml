name: A3 one-time content cluster remediation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply verified cluster links
        run: |
          python3 <<'PY'
          from pathlib import Path
          clusters = {
            'ceza-hukuku.html': [('tutuklama-kararina-itiraz.html','Tutuklama kararına itiraz'),('adli-kontrol-kararina-itiraz.html','Adli kontrol kararına itiraz'),('whatsapp-yazismalari-delil-olur-mu.html','WhatsApp yazışmaları ve elektronik deliller')],
            'aile-bosanma-hukuku.html': [('anlasmali-bosanma-davasi.html','Anlaşmalı boşanma davası'),('cekismeli-bosanma-davasi.html','Çekişmeli boşanma davası'),('velayet-davasi-velayetin-degistirilmesi.html','Velayet davası'),('6284-uzaklastirma-koruma-tedbirleri.html','6284 kapsamında koruma tedbirleri')],
            'is-hukuku.html': [('kidem-ihbar-tazminati.html','Kıdem ve ihbar tazminatı'),('fazla-mesai-alacagi-fazla-calismanin-ispati.html','Fazla mesai alacağı'),('is-kazasinda-isverenin-sorumlulugu.html','İş kazasında işverenin sorumluluğu')],
            'icra-iflas-hukuku.html': [('icra-takibine-itiraz.html','İcra takibine itiraz'),('itirazin-iptali-davasi.html','İtirazın iptali davası'),('menfi-tespit-davasi.html','Menfi tespit davası')],
            'gayrimenkul-hukuku.html': [('tapu-iptal-tescil-davasi.html','Tapu iptal ve tescil davası'),('kamulastirmasiz-el-atma-davasi.html','Kamulaştırmasız el atma davası'),('ortakligin-giderilmesi-davasi.html','Ortaklığın giderilmesi davası')],
            'miras-hukuku.html': [('sakli-pay-tenkis-davasi.html','Saklı pay ve tenkis davası'),('mirasciliktan-cikarma-mirastan-iskat.html','Mirasçılıktan çıkarma'),('ortakligin-giderilmesi-davasi.html','Ortaklığın giderilmesi davası'),('gaiplik-karari.html','Gaiplik kararı')],
            'ticaret-hukuku.html': [('ticari-alacak-dava-sarti-arabuluculuk.html','Ticari alacaklarda dava şartı arabuluculuk'),('banka-dekontu-borcun-varligini-ispatlar-mi.html','Banka dekontunun ispat değeri')],
            'idare-hukuku.html': [('iptal-davasi-yurutmenin-durdurulmasi.html','İptal davası ve yürütmenin durdurulması'),('kamulastirmasiz-el-atma-davasi.html','Kamulaştırmasız el atma davası')],
            'kira-hukuku.html': [('tahliye-davasi.html','Tahliye davası'),('tahliye-taahhutnamesi-gecerlilik-sartlari.html','Tahliye taahhütnamesinin geçerlilik şartları')],
            'sigorta-hukuku.html': [('sigorta-tahkim-komisyonuna-basvuru.html','Sigorta Tahkim Komisyonuna başvuru'),('trafik-kazasinda-tutanak-kusur-sigorta.html','Trafik kazasında tutanak, kusur ve sigorta')],
          }
          primary = {}
          for pillar, items in clusters.items():
            for f,_ in items:
              primary.setdefault(f,pillar)
          labels = {'ceza-hukuku.html':'Ceza Hukuku','aile-bosanma-hukuku.html':'Aile ve Boşanma Hukuku','is-hukuku.html':'İş Hukuku','icra-iflas-hukuku.html':'İcra ve İflas Hukuku','gayrimenkul-hukuku.html':'Gayrimenkul Hukuku','miras-hukuku.html':'Miras Hukuku','ticaret-hukuku.html':'Ticaret Hukuku','idare-hukuku.html':'İdare Hukuku','kira-hukuku.html':'Kira Hukuku','sigorta-hukuku.html':'Sigorta Hukuku'}
          # Pillar -> article links: only add a compact related block when links are not already all present.
          for pillar, items in clusters.items():
            p=Path(pillar); s=p.read_text()
            missing=[(f,l) for f,l in items if f not in s]
            if missing:
              links=' · '.join(f'<a href="{f}">{l}</a>' for f,l in missing)
              block=f'<p class="cluster-links"><strong>İlgili hukuki içerikler:</strong> {links}</p>'
              marker='</article>'
              if marker not in s: raise SystemExit(f'No article marker in {pillar}')
              s=s.replace(marker,block+marker,1); p.write_text(s)
          # Article -> primary pillar backlink, inserted into existing related section when absent.
          for article,pillar in primary.items():
            p=Path(article); s=p.read_text()
            if pillar in s: continue
            label=labels[pillar]
            anchor=f'<a href="{pillar}">{label}</a>'
            marker='<div class="related">'
            if marker in s:
              s=s.replace(marker,marker+anchor,1)
            else:
              # All current editorial pages should have related; fail instead of broad rewriting.
              raise SystemExit(f'Missing related block: {article}')
            p.write_text(s)
          # Hub -> all ten pillar pages without altering the 26-card selector/count.
          p=Path('hukuki-icerikler.html'); s=p.read_text()
          if 'class="cluster-nav"' not in s:
            links=' · '.join(f'<a href="{f}">{labels[f]}</a>' for f in clusters)
            nav=f'<nav class="cluster-nav" aria-label="Hukuk alanlarına göre içerikler"><strong>Hukuk alanları:</strong> {links}</nav>'
            marker='<a class="content-back" href="/">← Ana sayfaya dön</a>'
            if marker not in s: raise SystemExit('Hub insertion marker missing')
            s=s.replace(marker,marker+nav,1); p.write_text(s)
          PY
      - name: Static acceptance
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re,json
          sm=Path('sitemap.xml').read_text(); urls=re.findall(r'<loc>https://avbusraturunc.com/(.*?)</loc>',sm)
          html=[u for u in urls if u.endswith('.html')]
          broken=[]; json_errors=[]
          for f in html:
            p=Path(f)
            if not p.exists(): broken.append(('missing',f)); continue
            s=p.read_text()
            for href in re.findall(r'href=["\']([^"\']+)',s):
              if href.startswith(('http:','https:','mailto:','tel:','#','/')): continue
              target=href.split('#')[0].split('?')[0]
              if target and not Path(target).exists(): broken.append((f,target))
            for raw in re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',s,re.S):
              try: json.loads(raw)
              except Exception as e: json_errors.append((f,str(e)))
          if broken or json_errors:
            print('broken',broken); print('json',json_errors); raise SystemExit(1)
          hub=Path('hukuki-icerikler.html').read_text()
          if hub.count('class="content-card"') != 26: raise SystemExit('Hub card count changed')
          print('STATIC PASS',len(html),'HTML sitemap pages; 26 hub cards; no missing local targets; JSON-LD parse PASS')
          PY
      - name: Commit remediation
        run: |
          if git diff --quiet; then echo 'No changes required'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'A3 strengthen content clusters and internal linking'
          git push origin HEAD:main
