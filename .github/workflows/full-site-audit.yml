name: Full Site Technical Audit

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "sitemap.xml"
      - "scripts/full_site_audit.py"
      - ".github/workflows/full-site-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Run full site technical audit
        run: python scripts/full_site_audit.py

# Audits all root HTML files plus the legal-content hub, sitemap, tools and legacy migrations.
