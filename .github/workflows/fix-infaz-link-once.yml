name: One-time infaz fragment fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-infaz-link-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Fix only broken fragment link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('infaz-hesaplama.html')
          s=p.read_text(encoding='utf-8')
          old='href="hukuki-icerikler.html#ceza"'
          new='href="hukuki-icerikler.html"'
          assert s.count(old)==1, f'Expected exactly one target, found {s.count(old)}'
          s2=s.replace(old,new)
          assert s2.count(old)==0
          p.write_text(s2,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "infaz-hesaplama.html"
          git diff --exit-code -- . ':!infaz-hesaplama.html'
      - name: Commit exact fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infaz-hesaplama.html
          git commit -m "fix: repair infaz content hub link"
          git push origin HEAD:main
