name: One-time homepage CSS cache refresh

on:
  push:
    paths:
      - '.github/workflows/one-time-home-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh homepage stylesheet version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='home-polish.css?v=20260902-4'
          new='home-polish.css?v=20260905-1'
          if old not in s:
              raise SystemExit('Expected stylesheet reference not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: refresh homepage CSS cache for calculator layout'
          git push
