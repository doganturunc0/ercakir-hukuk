name: One-time homepage about fix

on:
  push:
    paths:
      - '.github/workflows/one-time-home-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage about navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<a href="#hakkimizda">Hakkımızda</a>', '<a href="hakkimizda.html">Hakkımızda</a>', 1)
          s = s.replace('<h2>Av. Büşra Turunç ve Erçakır Hukuk Bürosu hakkında.</h2>', '<h2>Avukat Büşra Turunç ve Erçakır Hukuk Bürosu hakkında.</h2>', 1)
          s = s.replace('<button class="text-link" data-modal-open="aboutModal">Çalışma esasları hakkında →</button>', '<a class="text-link" href="hakkimizda.html">Çalışma esasları hakkında →</a>', 1)

          modal_start = '<div class="modal" id="aboutModal"'
          if modal_start in s:
              start = s.index(modal_start)
              end_marker = '</div></div>\n<div class="analytics-consent"'
              end = s.index(end_marker, start)
              s = s[:start] + '<div class="analytics-consent"' + s[end + len('</div></div>\n<div class="analytics-consent"'):]

          s = s.replace('script.js?v=20260927-3', 'script.js?v=20261002-aboutfix2', 1)

          if 'data-modal-open="aboutModal"' in s:
              raise SystemExit('aboutModal trigger still present')
          if '<a href="#hakkimizda">Hakkımızda</a>' in s:
              raise SystemExit('old about nav link still present')
          if 'href="hakkimizda.html">Çalışma esasları hakkında →</a>' not in s:
              raise SystemExit('new about detail link missing')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage about fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'fix: make homepage about links direct and remove modal'
          git push
